<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZX Trace Viewer</title>
<!--
  Viewer for the cycle-by-cycle bus traces cpp-core writes (see
  cpp-core/src/tracelog.h), and for visualz80remix's own Trace Log exports,
  which use the same box-drawn table.

  Two ways in:
    * open this file in a browser and drop a trace on it;
    * the "ZX Spectrum: Show Trace" command in the VS Code extension, which
      loads this very file into a webview and posts the trace text in.

  Self-contained on purpose -- no build step, no dependencies, no network. It
  has to work from a file:// URL and inside a webview's CSP alike.

  The parser is driven by the table's own header row rather than by fixed
  column positions, so a capture made with the extra 48K columns, one made
  without them, and one made by visualz80remix all load the same way.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #14171c;
    --panel: #1b1f26;
    --edge: #2c323d;
    --ink: #d7dce4;
    --ink-dim: #8b93a1;
    --accent: #4aa8ff;
    --sel: #d03b3b;
    /* The two instruction bands, and the interrupt one. Taken from
       visualz80remix's own alternating blue/green so a capture looks the same
       here as it does there. */
    --band-a: #1d4f86;
    --band-b: #1f6a3d;
    --band-int: #6d4a17;
    --wave: #cfd6e2;
    --grid: #262c36;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --edge: #d9dde4;
      --ink: #1c2027;
      --ink-dim: #626b7a;
      --accent: #0b64c4;
      --sel: #c62828;
      --band-a: #cfe2f7;
      --band-b: #d2eeda;
      --band-int: #f7e6c4;
      --wave: #2a3038;
      --grid: #e6e9ee;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  h1 span { color: var(--ink-dim); font-weight: 400; }
  .spacer { flex: 1 1 auto; }
  button, label.filebtn, select, input {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover, label.filebtn:hover { border-color: var(--accent); }
  button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  input[type="text"] { cursor: text; width: 9em; }
  input[type="file"] { display: none; }
  .tabs { display: flex; gap: 4px; }
  .stats { color: var(--ink-dim); font-size: 12px; }
  .stats b { color: var(--ink); font-weight: 600; }

  /* ---- live capture: only ever shown inside the VS Code panel, which is the
     only place with a running emulator to record from ---- */
  #recBox { display: flex; align-items: center; gap: 8px; }
  #recBox label {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink-dim);
    cursor: default;
    font-size: 12px;
  }
  #recBox input[type="text"] { width: 5.5em; }
  #recBox input[type="checkbox"] { width: auto; padding: 0; cursor: pointer; }
  button:disabled, #recBox input:disabled { opacity: 0.45; cursor: default; }
  button:disabled:hover { border-color: var(--edge); }
  /* Recording is the one state worth colouring: it means a file on the other
     side of the connection is growing by ~85 bytes a half-clock. */
  #record.recording { background: var(--sel); border-color: var(--sel); color: #fff; }
  #recStatus { color: var(--ink-dim); font-size: 12px; white-space: nowrap; }

  main { flex: 1 1 auto; position: relative; min-height: 0; }
  section.view { position: absolute; inset: 0; display: none; }
  section.view.active { display: flex; flex-direction: column; }

  /* ---- empty state ---- */
  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    color: var(--ink-dim);
    padding: 24px;
  }
  #empty code {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--ink);
  }
  #empty[hidden] { display: none; }
  body.dragging #empty { color: var(--accent); }
  body.dragging::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px dashed var(--accent);
    border-radius: 8px;
    pointer-events: none;
    z-index: 20;
  }

  /* ---- trace log table ---- */
  #tableHead {
    flex: none;
    overflow: hidden;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
  }
  #tableScroll { flex: 1 1 auto; overflow: auto; position: relative; }
  #tableSpacer { position: relative; min-width: 100%; }
  .trow {
    position: absolute;
    left: 0;
    min-width: 100%;
    display: flex;
    white-space: pre;
    align-items: center;
  }
  .trow > span, .thead > span {
    flex: none;
    padding: 0 8px;
    overflow: hidden;
  }
  .thead {
    display: flex;
    min-width: 100%;
    white-space: pre;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .thead > span { border-right: 1px solid var(--edge); }
  .trow.m1 { filter: brightness(1.35); }
  .trow.sel { outline: 1px solid var(--sel); outline-offset: -1px; }
  .trow.sel > span:first-child { color: #fff; background: var(--sel); }
  .trow .sig { color: var(--ink); font-weight: 600; }
  .trow .asm { font-weight: 600; }
  .num { text-align: right; }

  /* ---- timing diagram ---- */
  #timingWrap { flex: 1 1 auto; display: flex; min-height: 0; }
  #timingLabels {
    flex: none;
    width: 82px;
    background: var(--panel);
    border-right: 1px solid var(--edge);
    overflow: hidden;
    position: relative;
  }
  #timingScroll { flex: 1 1 auto; overflow-x: auto; overflow-y: hidden; position: relative; }
  /* Pinned so the canvas only ever has to be one screen wide: the spacer
     below it gives the scrollbar the trace's full length, and drawTiming()
     redraws for whatever offset the scroll is at. */
  #timingScroll canvas { display: block; position: sticky; left: 0; }
  #timingSpacer { height: 1px; }
  .zoom { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); }
  footer {
    flex: none;
    padding: 6px 14px;
    background: var(--panel);
    border-top: 1px solid var(--edge);
    color: var(--ink-dim);
    font-size: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  footer b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>ZX Trace Viewer <span id="fileName">— no trace loaded</span></h1>
  <label class="filebtn" for="file">Open trace…</label>
  <input type="file" id="file" accept=".zxtrace,.txt,.log,text/plain">
  <div id="recBox" hidden>
    <button id="record" title="Record the running emulator, then load what was captured">
      ● Record</button>
    <label title="Half-T-states to record before the capture closes itself. 139,776 is one frame; 0 means unlimited.">limit
      <input type="text" id="recLimit" class="mono" value="25000"></label>
    <label title="Address to sample into the Watch column on every half-clock. Blank for none.">watch
      <input type="text" id="recWatch" class="mono" placeholder="$4000"></label>
    <label title="Add the 48K-specific columns: HALT, WAIT, INT, NMI, frame and T-state.">
      <input type="checkbox" id="recExtra"> 48K</label>
    <span id="recStatus"></span>
  </div>
  <div class="tabs">
    <button id="tabTable" aria-pressed="true">Trace Log</button>
    <button id="tabTiming" aria-pressed="false">Timing Diagram</button>
  </div>
  <label class="zoom" id="zoomBox" hidden>zoom
    <input type="range" id="zoom" min="2" max="24" value="7" style="width:110px;padding:0">
  </label>
  <span class="spacer"></span>
  <input type="text" id="goto" class="mono" placeholder="cycle or $addr" title="Jump to a T-state number, or to the next row whose address bus matches $XXXX">
  <span class="stats" id="stats"></span>
</header>

<main>
  <div id="empty">
    <div><strong>Drop a trace file here</strong>, or use “Open trace…”.</div>
    <div id="emptyHow">Produce one with <code>zx_server --trace-log boot.zxtrace</code>,
      or the <code>start_trace</code> MCP tool.</div>
  </div>

  <section class="view active" id="viewTable">
    <div id="tableHead"><div class="thead mono" id="theadRow"></div></div>
    <div id="tableScroll"><div id="tableSpacer"></div></div>
  </section>

  <section class="view" id="viewTiming">
    <div id="timingWrap">
      <div id="timingLabels"><canvas id="labelCanvas"></canvas></div>
      <div id="timingScroll"><canvas id="waveCanvas"></canvas><div id="timingSpacer"></div></div>
    </div>
  </section>
</main>

<footer id="footer" hidden></footer>

<script>
(function () {
  "use strict";

  // Titles that name a CPU/machine signal line. Anything in the table with one
  // of these titles is drawn as a waveform and read as "asserted when the cell
  // is non-empty" -- which is exactly how the writer emits them.
  var SIGNAL_TITLES = ["M1", "MREQ", "IORQ", "RFSH", "RD", "WR",
                       "HALT", "WAIT", "INT", "NMI", "BUSRQ", "BUSAK"];
  // Titles carrying a hex value rather than a level. Anything else that is not
  // metadata (Cycle/h, Frame, TState, Asm) is treated as a bus too, which is
  // what makes a watch column -- titled with its own address -- come out right.
  var META_TITLES = ["Cycle/h", "Frame", "TState", "Asm", "Symbol"];

  var ROW_H = 18;
  var BAR = "│"; // the box-drawing vertical the table is built from

  var state = {
    name: "",
    titles: [],
    rows: [],        // each row: array of trimmed cell strings
    groups: [],      // one per row: index of the instruction band it belongs to
    groupInfo: [],   // per band: {start, end, asm, interrupt}
    signalCols: [],
    busCols: [],
    asmCol: -1,
    cycleCol: 0,
    selected: -1,
    pxPerHalf: 7
  };

  var $ = function (id) { return document.getElementById(id); };

  // ---- parsing -------------------------------------------------------------

  // Splits one box-drawn row into trimmed cells. Border lines have no verticals
  // and yield null, which callers skip.
  function splitRow(line) {
    if (line.charAt(0) !== BAR) { return null; }
    var parts = line.split(BAR);
    // A leading and a trailing empty piece fall out of the split; drop both.
    parts.pop();
    parts.shift();
    for (var i = 0; i < parts.length; i++) { parts[i] = parts[i].trim(); }
    return parts;
  }

  function parse(text) {
    if (text.charCodeAt(0) === 0xFEFF) { text = text.slice(1); }
    var lines = text.split(/\r?\n/);
    var titles = null;
    var rows = [];
    for (var i = 0; i < lines.length; i++) {
      var cells = splitRow(lines[i]);
      if (cells === null) { continue; }
      if (titles === null) { titles = cells; continue; }
      // Guard against a truncated final row from a capture still in progress.
      if (cells.length === titles.length) { rows.push(cells); }
    }
    if (titles === null) {
      throw new Error("no table found — expected a box-drawn trace log");
    }
    return { titles: titles, rows: rows };
  }

  function classify(titles) {
    var signalCols = [];
    var busCols = [];
    var asmCol = -1;
    for (var i = 0; i < titles.length; i++) {
      var t = titles[i];
      if (t === "Asm") { asmCol = i; continue; }
      if (SIGNAL_TITLES.indexOf(t) >= 0) { signalCols.push(i); continue; }
      if (META_TITLES.indexOf(t) >= 0) { continue; }
      busCols.push(i);
    }
    return { signalCols: signalCols, busCols: busCols, asmCol: asmCol };
  }

  // An instruction band starts wherever M1 rises, or wherever the disassembly
  // changes. M1 alone would merge a tight loop's repetitions into one band; the
  // disassembly alone would merge a prefix's fetch into whatever came before.
  // Together they mark every real machine-cycle group the table can show.
  function findGroups(rows, m1Col, asmCol) {
    var groups = new Array(rows.length);
    var info = [];
    var prevM1 = true;
    var prevAsm = null;
    for (var i = 0; i < rows.length; i++) {
      var m1 = m1Col >= 0 && rows[i][m1Col] !== "";
      var asm = asmCol >= 0 ? rows[i][asmCol] : "";
      var starts = i === 0 || (m1 && !prevM1) || asm !== prevAsm;
      if (starts) {
        if (info.length > 0) { info[info.length - 1].end = i; }
        info.push({
          start: i,
          end: rows.length,
          asm: asm,
          interrupt: asm.indexOf("INT ACK") === 0
        });
      }
      groups[i] = info.length - 1;
      prevM1 = m1;
      prevAsm = asm;
    }
    return { groups: groups, info: info };
  }

  function load(name, text) {
    var parsed;
    try {
      parsed = parse(text);
    } catch (err) {
      $("empty").innerHTML = "";
      $("empty").textContent = "Couldn't read " + name + ": " + err.message;
      $("empty").hidden = false;
      return;
    }
    var kinds = classify(parsed.titles);
    var m1Col = parsed.titles.indexOf("M1");
    var grouped = findGroups(parsed.rows, m1Col, kinds.asmCol);

    state.name = name;
    state.titles = parsed.titles;
    state.rows = parsed.rows;
    state.signalCols = kinds.signalCols;
    state.busCols = kinds.busCols;
    state.asmCol = kinds.asmCol;
    state.m1Col = m1Col;
    state.cycleCol = Math.max(0, parsed.titles.indexOf("Cycle/h"));
    state.groups = grouped.groups;
    state.groupInfo = grouped.info;
    state.selected = parsed.rows.length > 0 ? 0 : -1;

    $("empty").hidden = true;
    $("fileName").textContent = "— " + name;
    $("stats").innerHTML = "<b>" + parsed.rows.length.toLocaleString() + "</b> half-T-states · <b>"
      + grouped.info.length.toLocaleString() + "</b> machine cycles";
    $("footer").hidden = false;
    $("zoomBox").hidden = false;
    buildTable();
    layoutTiming();
    select(0, true);
  }

  // ---- trace log table -----------------------------------------------------

  // Column pixel widths, from the widest content each column actually holds --
  // the table is monospace, so a character count is a width.
  function columnWidths() {
    var widths = [];
    for (var c = 0; c < state.titles.length; c++) {
      var max = state.titles[c].length;
      // Sampling rather than scanning every row: a 140k-row capture would
      // otherwise spend its whole load doing this, and the column contents are
      // fixed-width fields anyway.
      var step = Math.max(1, Math.floor(state.rows.length / 400));
      for (var r = 0; r < state.rows.length; r += step) {
        if (state.rows[r][c].length > max) { max = state.rows[r][c].length; }
      }
      widths.push(max * 7.8 + 18);
    }
    return widths;
  }

  var widths = [];
  var totalWidth = 0;

  function buildTable() {
    // The pooled rows are built for one column count; a trace with a different
    // one (extra columns on or off) cannot reuse them.
    for (var i = 0; i < pooled.length; i++) { pooled[i].remove(); }
    pooled = [];
    widths = columnWidths();
    totalWidth = 0;
    var head = $("theadRow");
    head.innerHTML = "";
    for (var c = 0; c < state.titles.length; c++) {
      var cell = document.createElement("span");
      cell.textContent = state.titles[c];
      cell.style.width = widths[c] + "px";
      if (c === state.cycleCol) { cell.className = "num"; }
      head.appendChild(cell);
      totalWidth += widths[c];
    }
    head.style.width = totalWidth + "px";
    var spacer = $("tableSpacer");
    spacer.style.height = (state.rows.length * ROW_H) + "px";
    spacer.style.width = totalWidth + "px";
    renderRows();
  }

  var pooled = [];

  function renderRows() {
    var scroll = $("tableScroll");
    var first = Math.max(0, Math.floor(scroll.scrollTop / ROW_H) - 4);
    var count = Math.ceil(scroll.clientHeight / ROW_H) + 8;
    var last = Math.min(state.rows.length, first + count);
    var spacer = $("tableSpacer");

    while (pooled.length < last - first) {
      var row = document.createElement("div");
      row.className = "trow mono";
      row.style.height = ROW_H + "px";
      row.style.width = totalWidth + "px";
      for (var c = 0; c < state.titles.length; c++) {
        row.appendChild(document.createElement("span"));
      }
      row.addEventListener("click", onRowClick);
      spacer.appendChild(row);
      pooled.push(row);
    }
    for (var p = 0; p < pooled.length; p++) {
      var el = pooled[p];
      var index = first + p;
      if (index >= last) { el.style.display = "none"; continue; }
      el.style.display = "";
      el.style.top = (index * ROW_H) + "px";
      el.dataset.index = String(index);
      paintRow(el, index);
    }
  }

  function paintRow(el, index) {
    var cells = state.rows[index];
    var band = state.groupInfo[state.groups[index]];
    el.style.background = band.interrupt ? "var(--band-int)"
      : (state.groups[index] % 2 === 0 ? "var(--band-a)" : "var(--band-b)");
    el.className = "trow mono"
      + (state.m1Col >= 0 && cells[state.m1Col] !== "" ? " m1" : "")
      + (index === state.selected ? " sel" : "");
    for (var c = 0; c < cells.length; c++) {
      var span = el.children[c];
      span.textContent = cells[c];
      span.style.width = widths[c] + "px";
      span.className = c === state.cycleCol ? "num"
        : (state.signalCols.indexOf(c) >= 0 ? "sig"
        : (c === state.asmCol ? "asm" : ""));
    }
  }

  function onRowClick(event) {
    select(Number(event.currentTarget.dataset.index), false);
  }

  function select(index, scrollTable) {
    if (index < 0 || index >= state.rows.length) { return; }
    state.selected = index;
    renderRows();
    if (scrollTable) {
      $("tableScroll").scrollTop = Math.max(0, index * ROW_H - 80);
    }
    var cells = state.rows[index];
    var parts = [];
    for (var c = 0; c < state.titles.length; c++) {
      if (cells[c] === "" && state.signalCols.indexOf(c) >= 0) { continue; }
      if (cells[c] === "") { continue; }
      parts.push("<b>" + escapeHtml(state.titles[c]) + "</b> " + escapeHtml(cells[c]));
    }
    var footer = $("footer");
    footer.innerHTML = "";
    for (var i = 0; i < parts.length; i++) {
      var span = document.createElement("span");
      span.innerHTML = parts[i];
      footer.appendChild(span);
    }
    ensureVisibleInTiming(index);
    drawTiming();
  }

  function escapeHtml(text) {
    return text.replace(/[&<>]/g, function (ch) {
      return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
    });
  }

  // ---- timing diagram ------------------------------------------------------
  //
  // Signals are active LOW, and drawn that way: the line sits high and dips for
  // the half-clocks the table shows the name in. That is the shape a Z80 timing
  // diagram has in every datasheet, and the whole reason to look at this view
  // rather than the table.

  var LANE_H = 26;
  var TOP_PAD = 26; // room for the instruction labels along the top

  function lanes() {
    var out = [{ title: "CLK", kind: "clk" }];
    for (var i = 0; i < state.signalCols.length; i++) {
      out.push({ title: state.titles[state.signalCols[i]], kind: "sig", col: state.signalCols[i] });
    }
    for (var b = 0; b < state.busCols.length; b++) {
      out.push({ title: state.titles[state.busCols[b]], kind: "bus", col: state.busCols[b] });
    }
    return out;
  }

  function layoutTiming() {
    var all = lanes();
    var height = TOP_PAD + all.length * LANE_H + 8;
    var labelCanvas = $("labelCanvas");
    var waveCanvas = $("waveCanvas");
    var dpr = window.devicePixelRatio || 1;

    $("timingLabels").style.height = height + "px";
    labelCanvas.width = 82 * dpr;
    labelCanvas.height = height * dpr;
    labelCanvas.style.width = "82px";
    labelCanvas.style.height = height + "px";

    var visible = Math.max(1, $("timingScroll").clientWidth);
    waveCanvas.width = visible * dpr;
    waveCanvas.height = height * dpr;
    waveCanvas.style.width = visible + "px";
    waveCanvas.style.height = height + "px";
    // The canvas itself only ever holds one screenful; the spacer gives the
    // scrollbar the full length of the trace, and drawTiming() redraws for the
    // current offset. 140k half-clocks at 7px each is a million-pixel canvas
    // otherwise, well past what browsers will allocate.
    $("timingSpacer").style.width = (state.rows.length * state.pxPerHalf) + "px";
    drawTiming();
  }

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function drawTiming() {
    if (state.rows.length === 0) { return; }
    var waveCanvas = $("waveCanvas");
    var labelCanvas = $("labelCanvas");
    var dpr = window.devicePixelRatio || 1;
    var ctx = waveCanvas.getContext("2d");
    var lctx = labelCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var all = lanes();
    var w = waveCanvas.width / dpr;
    var h = waveCanvas.height / dpr;
    var px = state.pxPerHalf;
    var scrollLeft = $("timingScroll").scrollLeft;
    var first = Math.max(0, Math.floor(scrollLeft / px) - 1);
    var last = Math.min(state.rows.length, first + Math.ceil(w / px) + 2);

    var colBg = css("--bg");
    var colPanel = css("--panel");
    var colInk = css("--ink");
    var colDim = css("--ink-dim");
    var colWave = css("--wave");
    var colSel = css("--sel");
    var colGrid = css("--grid");

    ctx.fillStyle = colBg;
    ctx.fillRect(0, 0, w, h);
    lctx.fillStyle = colPanel;
    lctx.fillRect(0, 0, 82, h);

    var xOf = function (index) { return index * px - scrollLeft; };

    // ---- instruction bands, behind everything ----
    var g = last > first ? state.groups[first] : 0;
    var lastGroup = last > first ? state.groups[last - 1] : -1;
    while (g <= lastGroup) {
      var band = state.groupInfo[g];
      var x0 = xOf(Math.max(band.start, first));
      var x1 = xOf(Math.min(band.end, last));
      ctx.fillStyle = band.interrupt ? css("--band-int")
        : (g % 2 === 0 ? css("--band-a") : css("--band-b"));
      ctx.globalAlpha = 0.55;
      ctx.fillRect(x0, TOP_PAD - 4, Math.max(1, x1 - x0), h - TOP_PAD);
      ctx.globalAlpha = 1;
      ctx.fillStyle = colInk;
      ctx.font = "600 11px ui-monospace, Consolas, monospace";
      if (x1 - x0 > 30) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0 + 3, 0, x1 - x0 - 6, TOP_PAD);
        ctx.clip();
        ctx.fillText(band.asm, x0 + 5, 15);
        ctx.restore();
      }
      g++;
    }

    // ---- T-state gridlines, on the H phase of each ----
    ctx.strokeStyle = colGrid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = first; i < last; i++) {
      if (!isHigh(i)) { continue; }
      var gx = Math.round(xOf(i)) + 0.5;
      ctx.moveTo(gx, TOP_PAD - 4);
      ctx.lineTo(gx, h);
    }
    ctx.stroke();

    // ---- the lanes ----
    for (var lane = 0; lane < all.length; lane++) {
      var top = TOP_PAD + lane * LANE_H;
      var hi = top + 5;
      var lo = top + LANE_H - 8;

      lctx.fillStyle = colInk;
      lctx.font = "600 11px ui-monospace, Consolas, monospace";
      lctx.fillText(all[lane].title, 8, top + LANE_H / 2 + 1);
      lctx.strokeStyle = colGrid;
      lctx.beginPath();
      lctx.moveTo(0, top - 3.5);
      lctx.lineTo(82, top - 3.5);
      lctx.stroke();

      ctx.strokeStyle = colWave;
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      if (all[lane].kind === "bus") {
        drawBusLane(ctx, all[lane].col, first, last, xOf, hi, lo, colWave, colInk, px);
        continue;
      }

      var prevY = null;
      for (var r = first; r < last; r++) {
        var asserted = all[lane].kind === "clk" ? isHigh(r)
                                                : state.rows[r][all[lane].col] !== "";
        // CLK is drawn as the real clock (high on the H phase); every other
        // line is active low, so "asserted" draws low.
        var y = all[lane].kind === "clk" ? (asserted ? hi : lo) : (asserted ? lo : hi);
        var xa = xOf(r);
        var xb = xOf(r + 1);
        if (prevY !== null && prevY !== y) {
          ctx.moveTo(xa, prevY);
          ctx.lineTo(xa, y);
        }
        ctx.moveTo(xa, y);
        ctx.lineTo(xb, y);
        prevY = y;
      }
      ctx.stroke();
    }

    // ---- selection ----
    if (state.selected >= first - 1 && state.selected <= last) {
      var sx = Math.round(xOf(state.selected)) + 0.5;
      ctx.strokeStyle = colSel;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, h);
      ctx.stroke();
      ctx.fillStyle = colSel;
      ctx.fillRect(sx, 0, Math.max(2, px), 3);
    }
    void colDim;
  }

  // A bus lane draws a band per run of equal values, with the value written in
  // it when it fits -- the standard timing-diagram idiom, and far more readable
  // than one label per half-clock.
  function drawBusLane(ctx, col, first, last, xOf, hi, lo, colWave, colInk, px) {
    var mid = (hi + lo) / 2;
    var r = first;
    ctx.font = "11px ui-monospace, Consolas, monospace";
    while (r < last) {
      var value = state.rows[r][col];
      var end = r;
      while (end < last && state.rows[end][col] === value) { end++; }
      var xa = xOf(r);
      var xb = xOf(end);
      var skew = Math.min(3, (xb - xa) / 3);
      ctx.strokeStyle = colWave;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xa, mid);
      ctx.lineTo(xa + skew, hi);
      ctx.lineTo(xb - skew, hi);
      ctx.lineTo(xb, mid);
      ctx.lineTo(xb - skew, lo);
      ctx.lineTo(xa + skew, lo);
      ctx.closePath();
      ctx.stroke();
      var text = value;
      if (ctx.measureText(text).width + 8 < xb - xa) {
        ctx.fillStyle = colInk;
        ctx.fillText(text, (xa + xb) / 2 - ctx.measureText(text).width / 2, mid + 4);
      }
      r = end;
      void px;
    }
  }

  // The H phase of a T-state, read off the "Cycle/h" cell's own suffix rather
  // than from the row's parity -- a capture can start on either phase.
  function isHigh(index) {
    var label = state.rows[index][state.cycleCol];
    return label.charAt(label.length - 1) === "0";
  }

  function ensureVisibleInTiming(index) {
    var scroll = $("timingScroll");
    var x = index * state.pxPerHalf;
    var view = scroll.clientWidth;
    if (x < scroll.scrollLeft + 40 || x > scroll.scrollLeft + view - 40) {
      scroll.scrollLeft = Math.max(0, x - view / 2);
    }
  }

  // ---- wiring --------------------------------------------------------------

  $("tableScroll").addEventListener("scroll", function () {
    renderRows();
    $("tableHead").scrollLeft = $("tableScroll").scrollLeft;
  });

  $("timingScroll").addEventListener("scroll", drawTiming);
  $("timingScroll").addEventListener("click", function (event) {
    var rect = $("timingScroll").getBoundingClientRect();
    var x = event.clientX - rect.left + $("timingScroll").scrollLeft;
    select(Math.floor(x / state.pxPerHalf), true);
  });

  $("zoom").addEventListener("input", function () {
    state.pxPerHalf = Number($("zoom").value);
    $("timingSpacer").style.width = (state.rows.length * state.pxPerHalf) + "px";
    drawTiming();
  });

  function showView(which) {
    $("viewTable").classList.toggle("active", which === "table");
    $("viewTiming").classList.toggle("active", which === "timing");
    $("tabTable").setAttribute("aria-pressed", String(which === "table"));
    $("tabTiming").setAttribute("aria-pressed", String(which === "timing"));
    if (which === "timing") { layoutTiming(); } else { renderRows(); }
  }
  $("tabTable").addEventListener("click", function () { showView("table"); });
  $("tabTiming").addEventListener("click", function () { showView("timing"); });

  // "1234" jumps to that T-state; "$4000" or "4000h" finds the next row whose
  // address bus holds it, which is how you find the write you came looking for.
  $("goto").addEventListener("keydown", function (event) {
    if (event.key !== "Enter") { return; }
    var text = $("goto").value.trim();
    if (text === "") { return; }
    var abCol = state.titles.indexOf("AB");
    var hex = /^\$([0-9a-fA-F]+)$|^([0-9a-fA-F]+)[hH]$/.exec(text);
    if (hex && abCol >= 0) {
      var want = (hex[1] || hex[2]).toUpperCase().padStart(4, "0");
      for (var i = state.selected + 1; i !== state.selected; i++) {
        if (i >= state.rows.length) { i = -1; continue; }
        if (state.rows[i][abCol].toUpperCase() === want) { select(i, true); return; }
      }
      return;
    }
    var cycle = parseInt(text, 10);
    if (isNaN(cycle)) { return; }
    for (var r = 0; r < state.rows.length; r++) {
      if (parseInt(state.rows[r][state.cycleCol], 10) >= cycle) { select(r, true); return; }
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.target.tagName === "INPUT") { return; }
    if (event.key === "ArrowDown" || event.key === "ArrowRight") {
      select(state.selected + 1, true);
      event.preventDefault();
    } else if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
      select(state.selected - 1, true);
      event.preventDefault();
    }
  });

  window.addEventListener("resize", function () {
    renderRows();
    if ($("viewTiming").classList.contains("active")) { layoutTiming(); }
  });

  // ---- getting a file in ---------------------------------------------------

  $("file").addEventListener("change", function (event) {
    var file = event.target.files[0];
    if (file) { readFile(file); }
  });

  function readFile(file) {
    var reader = new FileReader();
    reader.onload = function () { load(file.name, String(reader.result)); };
    reader.readAsText(file);
  }

  ["dragenter", "dragover"].forEach(function (type) {
    document.addEventListener(type, function (event) {
      event.preventDefault();
      document.body.classList.add("dragging");
    });
  });
  ["dragleave", "drop"].forEach(function (type) {
    document.addEventListener(type, function (event) {
      event.preventDefault();
      if (type === "dragleave" && event.relatedTarget) { return; }
      document.body.classList.remove("dragging");
    });
  });
  document.addEventListener("drop", function (event) {
    var file = event.dataTransfer && event.dataTransfer.files[0];
    if (file) { readFile(file); }
  });

  // ---- live capture --------------------------------------------------------
  //
  // Only reachable from the VS Code panel: recording means telling a running
  // emulator to start writing a file, which a page opened from file:// has no
  // way to do. The extension host owns the debug session and does the talking
  // (see extension.js's startLiveTrace) -- this end is two messages out and a
  // status message back.

  var live = {
    enabled: false,   // running inside the panel at all
    available: false, // ...with a zxspectrum debug session to record from
    recording: false
  };

  // "$4000", "0x4000" and "4000" all mean the same address, matching what the
  // Go-to box already accepts. Returns null for blank, or -1 for nonsense.
  function parseAddress(text) {
    var trimmed = text.trim().replace(/^[$#]/, "").replace(/^0x/i, "");
    if (trimmed === "") { return null; }
    if (!/^[0-9a-fA-F]{1,4}$/.test(trimmed)) { return -1; }
    return parseInt(trimmed, 16);
  }

  function recordClicked() {
    if (!live.available) { return; }
    if (live.recording) {
      vscodeApi.postMessage({ type: "stopTrace" });
      $("recStatus").textContent = "stopping…";
      return;
    }
    var limit = $("recLimit").value.trim();
    if (limit !== "" && !/^\d+$/.test(limit)) {
      $("recStatus").textContent = "limit must be a number of half-T-states";
      return;
    }
    var watch = parseAddress($("recWatch").value);
    if (watch === -1) {
      $("recStatus").textContent = "watch must be an address like $4000";
      return;
    }
    vscodeApi.postMessage({
      type: "startTrace",
      limit: limit === "" ? null : Number(limit),
      watch: watch,
      extra: $("recExtra").checked
    });
    $("recStatus").textContent = "starting…";
  }

  // The one place the record controls' appearance is decided, so the button,
  // the inputs and the status line cannot disagree about what is going on.
  function paintLive(status, message) {
    if (!live.enabled) { return; }
    $("recBox").hidden = false;
    var button = $("record");
    button.disabled = !live.available;
    button.textContent = live.recording ? "■ Stop" : "● Record";
    button.classList.toggle("recording", live.recording);
    button.title = live.available
      ? (live.recording ? "Stop recording and load what was captured"
                        : "Record the running emulator, then load what was captured")
      : "Start a ZX Spectrum debug session to record from";
    // The options describe the capture being started, so they are fixed for as
    // long as one is running.
    $("recLimit").disabled = live.recording;
    $("recWatch").disabled = live.recording;
    $("recExtra").disabled = live.recording;

    if (message) {
      $("recStatus").textContent = message;
    } else if (!live.available) {
      $("recStatus").textContent = "no debug session";
    } else if (live.recording) {
      var rows = status && status.rows ? status.rows : 0;
      var limit = status && status.limit ? status.limit : 0;
      $("recStatus").textContent = "recording · " + rows.toLocaleString()
        + (limit ? " / " + limit.toLocaleString() : "") + " half-T-states";
    } else if (status) {
      // A capture that has just ended, whether by the Stop button or by
      // reaching its limit -- the count is the same either way, and saying it
      // is how you know the empty ones were empty.
      $("recStatus").textContent = "captured " + (status.rows || 0).toLocaleString()
        + " half-T-states";
    } else {
      $("recStatus").textContent = "";
    }
  }

  // ---- messages from the extension host -------------------------------------

  // The extension can't hand a webview a File, so it reads the trace in the
  // extension host and posts the text through instead.
  window.addEventListener("message", function (event) {
    var message = event.data;
    if (!message) { return; }
    if (message.type === "trace") {
      load(message.name || "trace", message.text);
    } else if (message.type === "live") {
      // Sent when the panel opens and whenever a debug session starts or
      // ends, so the button follows the session without being clicked first.
      live.available = !!message.available;
      if (!live.available) { live.recording = false; }
      paintLive(null, null);
    } else if (message.type === "traceStatus") {
      live.recording = message.state === "recording";
      paintLive(message.status, message.message || null);
    }
  });

  // Inside a VS Code webview the browser file picker cannot reach the
  // workspace, so "Open trace…" is handed to the extension host instead and
  // comes back as a "trace" message like any other load.
  var vscodeApi = null;
  if (typeof acquireVsCodeApi === "function") {
    vscodeApi = acquireVsCodeApi();
    var picker = document.querySelector("label.filebtn");
    picker.removeAttribute("for");
    picker.addEventListener("click", function () {
      vscodeApi.postMessage({ type: "pick" });
    });
    live.enabled = true;
    $("record").addEventListener("click", recordClicked);
    $("emptyHow").textContent =
      "Press Record above to capture the running emulator, or open a capture made "
      + "with the start_trace MCP tool or zx_server --trace-log.";
    paintLive(null, null);
    vscodeApi.postMessage({ type: "ready" });
  }
})();
</script>
</body>
</html>

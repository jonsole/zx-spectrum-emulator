<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Filmation Templates</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px var(--vscode-font-family, system-ui, sans-serif);
           color: var(--vscode-foreground, #ccc);
           background: var(--vscode-editor-background, #1e1e1e);
           box-sizing: border-box; overflow: hidden; }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    h3 { font-size: 11px; font-weight: 600; margin: 14px 0 6px; text-transform: uppercase;
         letter-spacing: .06em; opacity: .75; display: flex; align-items: center; gap: 8px; }
    h3 .spacer { flex: 1 1 auto; }
    h3 .count { font-weight: normal; opacity: .8; letter-spacing: 0; }

    button { font: inherit; padding: 3px 10px; border: 0; border-radius: 2px; cursor: pointer;
             color: var(--vscode-button-secondaryForeground, #ccc);
             background: var(--vscode-button-secondaryBackground, #3a3d41); }
    button:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground, #45494e); }
    button.small { padding: 1px 7px; font-size: 11px; }
    button:disabled { opacity: .4; cursor: default; }
    select, input[type=text], input[type=number] {
      font: inherit; padding: 2px 6px; border-radius: 2px;
      color: var(--vscode-input-foreground, #ccc);
      background: var(--vscode-input-background, #3c3c3c);
      border: 1px solid var(--vscode-input-border, transparent); }
    input[type=number] { width: 52px; }
    input[type=text] { min-width: 0; }

    .page { display: flex; height: 100%; }
    .list { width: 280px; flex: 0 0 auto; overflow: auto; padding: 12px 10px 20px 14px;
            border-right: 1px solid var(--vscode-panel-border, #333); box-sizing: border-box; }
    /* The main column is two panes and the bar between them: the template and
       its picture above, its pieces below. The bar sets how tall the top one
       is, and the picture grows to fill it. */
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;
            overflow: hidden; }
    .top { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
           padding: 12px 18px 6px; box-sizing: border-box; overflow: hidden; }
    .split { flex: 0 0 6px; cursor: row-resize; position: relative;
             background: var(--vscode-panel-border, #333); opacity: .6; }
    .split:hover, .split.on { opacity: 1;
             background: var(--vscode-sash-hoverBorder, var(--vscode-focusBorder, #007fd4)); }
    .bottom { flex: 1 1 auto; overflow: auto; padding: 8px 18px 24px; box-sizing: border-box;
              min-height: 0; }

    .row { display: flex; align-items: baseline; gap: 6px; padding: 3px 6px; border-radius: 3px;
           cursor: pointer; font-variant-numeric: tabular-nums; }
    .row:hover { background: var(--vscode-list-hoverBackground, #2a2d2e); }
    .row.on { background: var(--vscode-list-activeSelectionBackground, #094771);
              color: var(--vscode-list-activeSelectionForeground, #fff); }
    .row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .dim, .dim { opacity: .6; font-size: 11px; }
    .row.unused .name { opacity: .55; font-style: italic; }
    .mark { font-size: 10px; padding: 0 4px; border-radius: 2px; opacity: .85;
            background: var(--vscode-badge-background, #4d4d4d);
            color: var(--vscode-badge-foreground, #fff); }

    .adder { display: flex; gap: 6px; margin: 6px 0 0; }
    .adder input { flex: 1 1 auto; }

    .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .head input { flex: 1 1 200px; font-size: 14px; font-weight: 600; }
    .notes { margin: 8px 0 0; line-height: 1.55; }
    .notes .warn { color: var(--vscode-editorWarning-foreground, #cca700); }
    .notes .bad { color: var(--vscode-errorForeground, #f48771); }

    .showin { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .mover { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .mover label { display: inline-flex; gap: 4px; align-items: center; }
    .stage { flex: 1 1 auto; min-height: 0; margin: 10px 0 4px; background: #000;
             border-radius: 3px; display: flex; align-items: center; justify-content: center;
             line-height: 0; overflow: hidden; }
    canvas { image-rendering: pixelated; cursor: grab; }

    table.pieces { border-collapse: collapse; margin-top: 6px; }
    table.pieces td { padding: 3px 6px 3px 0; vertical-align: middle; white-space: nowrap; }
    table.pieces tr.on td { background: var(--vscode-list-inactiveSelectionBackground, #37373d); }
    table.pieces tr { cursor: pointer; }
    table.pieces label { display: inline-flex; gap: 3px; align-items: center; margin-right: 6px; }
    /* A box of the piece's own: its three sizes, after the flags. */
    .boxsize { display: inline-flex; gap: 4px; align-items: center; margin-left: 6px; }
    .boxsize > .dim { margin-right: 2px; }
    .rooms { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .rooms button { font-variant-numeric: tabular-nums; }
    .empty { opacity: .6; padding: 24px 0; }

    /* Adding a piece: every graphic as a picture, in a dialog over the page. */
    button.primary { color: var(--vscode-button-foreground, #fff);
                     background: var(--vscode-button-background, #0e639c); }
    button.primary:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); }
    .overlay { position: fixed; inset: 0; z-index: 10; display: none;
               align-items: center; justify-content: center;
               background: rgba(0, 0, 0, .45); }
    .dialog { width: min(900px, calc(100vw - 40px)); height: calc(100vh - 60px);
              box-sizing: border-box; padding: 14px 16px; border-radius: 6px;
              display: flex; flex-direction: column; gap: 10px;
              background: var(--vscode-editorWidget-background, #252526);
              border: 1px solid var(--vscode-editorWidget-border, #454545);
              box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
    .dialog h3 { margin: 0; }
    .dialog .controls { display: flex; gap: 10px; align-items: center; }
    .dialog .controls input { flex: 1 1 auto; }
    .picker { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid;
              grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
              gap: 6px; align-content: start; }
    .tile { background: #000; border: 1px solid var(--vscode-editorWidget-border, #333);
            border-radius: 3px; padding: 0; cursor: pointer; color: inherit;
            display: flex; flex-direction: column; align-items: stretch; }
    .tile:hover { outline: 1px solid var(--vscode-focusBorder, #007fd4); }
    .tile.here { outline: 2px solid var(--vscode-focusBorder, #007fd4); }
    .tile .artbox { height: 62px; display: flex; align-items: center;
                    justify-content: center; overflow: hidden; }
    .tile .caption { font-size: 10px; line-height: 1.3; padding: 2px 3px 3px;
                     background: var(--vscode-editorWidget-background, #252526);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                     font-variant-numeric: tabular-nums; }
    .tile .caption .dim { display: block; }
    .art { background-repeat: no-repeat; image-rendering: pixelated;
           transform-origin: center center; }
    .dialog .foot { display: flex; gap: 8px; align-items: center; }
    .dialog .foot .spacer { flex: 1 1 auto; }
  </style>
</head>
<body>
  <div class="page">
    <div class="list" id="list"></div>
    <div class="main" id="main"></div>
  </div>
  <div class="overlay" id="dialog"></div>

<script>
/*@sheet_model.js@*/
/*@room_model.js@*/
/*@room_render.js@*/
/*@host@*/

// The page's own half: a list of the castle's templates, and the one picked,
// drawn on its own with its pieces laid out beneath for editing.
//
// Everything that knows what a castle IS -- expanding a template, drawing it,
// what can be renamed or deleted -- lives in room_model.js and room_render.js,
// shared with the room designer. This only lays it out and sends every change
// back as the whole file.
(function () {
  'use strict';

  const host = window.templatesHost;
  let boot = host.boot;
  let atlas = null;

  const GROUPS = [
    { group: 'sceneryTemplates', title: 'Scenery', key: 'blocks', piece: 'piece' },
    { group: 'objectTemplates', title: 'Objects', key: 'entries', piece: 'sprite' }
  ];
  // How big the picture of a template is: exactly as big as the top pane lets
  // it be, not a whole multiple of the game's pixels -- a pane is whatever size
  // it has been dragged to, and rounding down to the next whole step would
  // throw away up to half of it.
  //
  // So the picture is DRAWN at a whole number of canvas pixels to the game's
  // pixel -- the next one up from the fit, so nothing is lost -- and then
  // stretched onto the screen to fit exactly, nearest-neighbour, so a pixel
  // stays a hard-edged block. Clicks and drags already measure against the
  // canvas's size on the screen, so they land wherever it is drawn.
  // MAX_SCALE bounds the drawing, not the picture.
  //
  // The bar under the picture sets how tall the pane is. STAGE_* are what the
  // picture fits when there is no layout to measure -- the tests' fake DOM, or
  // a pane not yet drawn.
  const MAX_SCALE = 12;
  const STAGE_WIDTH = 520;
  const STAGE_HEIGHT = 300;
  // How tall the top pane may be, and where it starts: remembered across
  // templates and across reopening, in this browser's own storage.
  const TOP_MIN = 160;
  const BOTTOM_MIN = 80;
  const TOP_KEY = 'filmation.templates.top';
  let topHeight = (function () {
    try {
      const said = Number(window.localStorage && window.localStorage.getItem(TOP_KEY));
      return said > 0 ? said : 420;
    } catch (err) {
      return 420;
    }
  }());

  let sheet, graphics, others, numbers, boxes, index, adj, graphicList;
  // Each sheet's picture, by the sheet's name ('' the game's own): the
  // pieces are drawn from these, a Melkhior door from the doors sheet.
  const pictures = {};
  const loadedFrom = {};
  let adder = null;           // the Add dialog while it is open

  // What is on screen: a template, and which of its pieces is selected.
  let pick = null;            // { group, name }
  let chosen = 0;
  let lastItems = [];         // what the picture drew, for clicks
  let frame = null;           // where the picture was cut from, and at what scale
  let resizing = null;        // the bar being dragged, and where it started
  let panes = null;           // { top, stage, canvas } as last drawn
  // What the template is shown in: on its own, on the floor of one of the
  // castle's room shapes, or in a room that places it. Kept when another
  // template is picked, as far as it still makes sense for that one.
  let view = { kind: 'alone' };
  let drag = null;            // a piece being dragged, and where it started

  const el = {
    list: document.getElementById('list'),
    main: document.getElementById('main')
  };

  function make(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function hex(n) {
    return (n < 16 ? '0' : '') + n.toString(16).toUpperCase();
  }

  // --- what the files say ------------------------------------------------

  function load(next) {
    boot = next;
    // One castle: the rooms beside this file, with its templates in them.
    atlas = withTemplates(next.rooms, next.templates);
    sheet = next.sheet || {};
    graphics = next.graphics || {};
    others = next.others || {};
    numbers = graphicNumbers(sheet, graphics);
    boxes = graphicBoxes(sheet, graphics);
    index = sheetIndex(sheet, graphics, others);
    adj = readSpriteAdj(graphics);
    graphicList = Array.from(numbers.keys()).sort();

    // Reopen on what was showing, if it survives; otherwise the one the host
    // asked for; otherwise the first scenery template.
    const want = pick || (next.template ? findGroup(next.template) : null);
    if (want && Object.prototype.hasOwnProperty.call(atlas[want.group], want.name)) {
      pick = want;
    } else {
      pick = { group: 'sceneryTemplates', name: Object.keys(atlas.sceneryTemplates)[0] };
      chosen = 0;
    }
  }

  function findGroup(name) {
    for (const g of GROUPS) {
      if (Object.prototype.hasOwnProperty.call(atlas[g.group], name)) {
        return { group: g.group, name: name };
      }
    }
    return null;
  }

  function kindOf(group) {
    return GROUPS.find(function (g) { return g.group === group; });
  }

  // Every change goes back as the whole of templates.json: the editor's undo,
  // dirty mark and Save do the rest, and the designer reloads from it.
  function changed() {
    host.save(serializeTemplates(atlas, boot.eol));
    render();
  }

  function choose(group, name) {
    pick = { group: group, name: name };
    chosen = 0;
    if (host.picked) host.picked(name);
    render();
  }

  // --- the list ------------------------------------------------------------

  function renderList() {
    el.list.innerHTML = '';
    el.list.appendChild(make('h1', '', titleOf()));
    const used = refreshUsage(atlas);

    for (const g of GROUPS) {
      const names = Object.keys(atlas[g.group]);
      const h = make('h3');
      h.appendChild(make('span', '', g.title));
      h.appendChild(make('span', 'count', names.length + ' / ' + templateLimit(atlas, g.group)));
      el.list.appendChild(h);

      names.forEach(function (name, at) {
        const row = make('div', 'row');
        if (pick && pick.group === g.group && pick.name === name) row.classList.add('on');
        if (!used.has(name)) row.classList.add('unused');
        row.appendChild(make('span', 'dim', '$' + hex(at)));
        row.appendChild(make('span', 'name', name));
        if (codeRef(g.group, at)) {
          const mark = make('span', 'mark', 'code');
          mark.title = 'the game’s code refers to it as ' + codeRef(g.group, at).label;
          row.appendChild(mark);
        }
        const count = roomsUsing(atlas, name).length;
        row.appendChild(make('span', 'dim', count ? count + ' rm' : 'unused'));
        row.title = name + ' — ' + atlas[g.group][name].length + ' ' + g.piece +
                    (atlas[g.group][name].length === 1 ? '' : 's');
        row.addEventListener('click', function () { choose(g.group, name); });
        el.list.appendChild(row);
      });

      // A new template goes on the end of its table, where it renumbers
      // nothing -- see newTemplate.
      const adder = make('div', 'adder');
      const field = make('input');
      field.type = 'text';
      field.placeholder = g.group === 'sceneryTemplates' ? 'scenery_new' : 'object_new';
      const add = make('button', 'small', 'New');
      add.addEventListener('click', function () {
        const name = field.value.trim();
        const why = templateNameProblem(atlas, name);
        if (why) { field.title = why; field.focus(); return; }
        if (newTemplate(atlas, g.group, name) === null) return;
        pick = { group: g.group, name: name };
        chosen = 0;
        changed();
      });
      adder.appendChild(field);
      adder.appendChild(add);
      el.list.appendChild(adder);
    }
  }

  function titleOf() {
    return gameTitle(atlas) + ' templates';
  }

  function codeRef(group, at) {
    const refs = (boot.codeRefs && boot.codeRefs[group]) || {};
    return refs[at] || null;
  }

  // --- the template picked --------------------------------------------------

  function renderMain() {
    el.main.innerHTML = '';
    panes = null;
    if (!pick) { el.main.appendChild(make('div', 'empty', 'no template')); return; }

    // The two panes, and the bar between them. Everything above the bar is
    // about what the template IS; everything below, what it is made of.
    const top = make('div', 'top');
    top.style.height = topHeight + 'px';
    const bar = make('div', 'split');
    bar.title = 'drag to make the picture bigger or smaller';
    bar.addEventListener('mousedown', function (event) {
      resizing = { y: event.clientY, from: topHeight };
      bar.classList.add('on');
      if (event.preventDefault) event.preventDefault();
    });
    const bottom = make('div', 'bottom');
    el.main.appendChild(top);
    el.main.appendChild(bar);
    el.main.appendChild(bottom);
    const kind = kindOf(pick.group);
    const name = pick.name;
    const template = atlas[pick.group][name];
    const at = templateIndex(atlas[pick.group]).get(name);

    // The name, and what can be done to the template as a whole.
    const head = make('div', 'head');
    const field = make('input');
    field.type = 'text';
    field.value = name;
    head.appendChild(field);
    const rename = make('button', '', 'Rename');
    rename.addEventListener('click', function () {
      const to = field.value.trim();
      if (to === name) return;
      if (renameTemplate(atlas, name, to) === null) {
        field.title = templateNameProblem(atlas, to) || 'cannot rename';
        return;
      }
      pick = { group: pick.group, name: to };
      // Rooms name their templates, so a rename is both files in one step.
      host.rename(serializeTemplates(atlas, boot.eol),
                  serializeAtlas(atlas, boot.roomsEol || boot.eol));
      render();
    });
    head.appendChild(rename);

    const copyAs = make('input');
    copyAs.type = 'text';
    copyAs.placeholder = 'copy as…';
    copyAs.style.flex = '0 1 140px';
    head.appendChild(copyAs);
    const duplicate = make('button', '', 'Duplicate');
    duplicate.addEventListener('click', function () {
      const to = copyAs.value.trim();
      const why = templateNameProblem(atlas, to);
      if (why) { copyAs.title = why; copyAs.focus(); return; }
      if (duplicateTemplate(atlas, pick.group, name, to) === null) return;
      pick = { group: pick.group, name: to };
      chosen = 0;
      changed();
    });
    head.appendChild(duplicate);

    const remove = make('button', '', 'Delete');
    const refusal = deleteProblem(atlas, pick.group, name);
    remove.disabled = !!refusal;
    remove.title = refusal || 'delete this template';
    remove.addEventListener('click', function () {
      const group = pick.group;
      if (!deleteTemplate(atlas, group, name)) return;
      // The one before it, which is now the last.
      const left = Object.keys(atlas[group]);
      pick = left.length ? { group: group, name: left[left.length - 1] }
                         : { group: 'sceneryTemplates',
                             name: Object.keys(atlas.sceneryTemplates)[0] };
      chosen = 0;
      changed();
    });
    head.appendChild(remove);
    top.appendChild(head);

    // What it is, and what depends on it.
    const notes = make('div', 'notes');
    const rooms = roomsUsing(atlas, name);
    notes.appendChild(make('div', '',
      'index $' + hex(at) + ' · ' + template.length + ' ' + kind.piece +
      (template.length === 1 ? '' : 's') + ' · ' +
      (rooms.length ? 'placed in ' + rooms.length + ' room' + (rooms.length === 1 ? '' : 's')
        : 'no room places it')));
    if (pick.group === 'sceneryTemplates') {
      const side = doorwayOf(atlas, name);
      // Knight Lore and Pentagram decide it by index; a castle whose file
      // lists its doorways decides it by that list, which is keyed by name.
      const listed = !!(atlas.templatesMeta && atlas.templatesMeta.doorways);
      if (side) notes.appendChild(make('div', '', 'a doorway, facing ' + side +
        (listed ? ' — as meta.doorways in templates.json says'
          : ' — decided by its place in the table, not its name')));
      if (isBackgroundTemplate(atlas, name)) {
        notes.appendChild(make('div', '', 'background: drawn first, never sorted'));
      }
    }
    const ref = codeRef(pick.group, at);
    if (ref) {
      notes.appendChild(make('div', 'warn',
        'The game’s code refers to this template as ' + ref.label + ' (' +
        ref.files.join(', ') + '). Renaming it changes that label, and the build ' +
        'stops until the code is changed to match.'));
    }
    // A piece the game draws somewhere other than where it is: it works the
    // place out in eight bits. Outlined in red in the picture; here, why.
    const said = [];
    for (const item of itemsOf(name)) {
      if (!item.mine || !item.wrap || said.indexOf(item.piece.entry) >= 0) continue;
      said.push(item.piece.entry);
      const p = item.piece;
      const which = kind.piece + ' ' + p.entry + ' ';
      notes.appendChild(make('div', 'bad', which + ({
        back: 'is too far back for the game to draw: V − U is ' + (p.v - p.u) +
              ', past 127, and the engine’s projection drops a bit and draws it ' +
              '128 rows lower than it stands. A room’s far corner is at 128.',
        front: 'is too far forward for the game to draw: V − U is ' + (p.v - p.u) +
               ', below −128, and the game draws it 128 rows higher than it stands.',
        top: 'is above the top of the screen: the game draws it wrapped round to the bottom.',
        bottom: 'is below the bottom of the screen: the game draws it wrapped round to the top.',
        side: 'is off the side of the screen: the game draws it wrapped round to the other side.'
      })[item.wrap]));
    }
    if (rooms.length) {
      notes.appendChild(make('div', 'dim',
        'A change here moves every one of those rooms.'));
    }
    top.appendChild(notes);

    // How it moves, where templates.json says (meta.movers).
    if (pick.group === 'objectTemplates' && hasMovers(atlas)) top.appendChild(moverRow(name));

    // What to show it in. A template is placed by rooms, and a scenery piece
    // that looks right on its own can be half through a wall in a narrow room.
    top.appendChild(showIn(name, rooms));

    // The picture, which fills what is left of the top pane.
    const stage = make('div', 'stage');
    const canvas = make('canvas');
    stage.appendChild(canvas);
    top.appendChild(stage);
    panes = { top: top, stage: stage, canvas: canvas };
    paint(canvas, template);

    // ...and everything below the bar, in a pane of its own that scrolls.
    bottom.appendChild(make('div', 'dim', pick.group === 'sceneryTemplates'
      ? 'drag a piece, or the arrows to move it; Ctrl+↑↓ or [ ] to lift; ' +
        'Shift for eight at a time; Delete removes it'
      : 'drag a sprite, or the arrows, to move its nudge by half a cell; ' +
        'Ctrl+↑↓ or [ ] to raise it by four, a whole level with Shift; ' +
        'Delete removes it'));

    // The pieces.
    const h = make('h3');
    h.appendChild(make('span', '', kind.piece + 's'));
    h.appendChild(make('span', 'spacer'));
    const add = make('button', 'small', 'Add…');
    add.title = 'pick a graphic to add as a new ' + kind.piece;
    add.addEventListener('click', function () { openAdder(); });
    h.appendChild(add);
    bottom.appendChild(h);

    if (!template.length) {
      bottom.appendChild(make('div', 'dim', 'no ' + kind.piece + 's yet'));
    } else {
      bottom.appendChild(piecesTable(template, kind));
    }

    // Where it is used, each a way to go there in the designer.
    if (rooms.length) {
      bottom.appendChild(make('h3', '', 'placed in'));
      const list = make('div', 'rooms');
      for (const n of rooms) {
        const go = make('button', 'small', '$' + hex(n));
        go.title = 'show room $' + hex(n) + ' in the designer';
        go.addEventListener('click', function () { host.showRoom(n); });
        list.appendChild(go);
      }
      bottom.appendChild(list);
    }
  }

  // Keep the view sensible for the template now picked: a room that does not
  // place it is swapped for the first that does, or for none.
  function settleView(name, rooms) {
    if (view.kind === 'room' && rooms.indexOf(view.room) < 0) {
      view = rooms.length ? { kind: 'room', room: rooms[0] } : { kind: 'alone' };
    }
    if (view.kind === 'shape' && !atlas.roomDimensions[view.shape]) view = { kind: 'alone' };
  }

  function viewKey(v) {
    return v.kind === 'room' ? 'room:' + v.room : v.kind === 'shape' ? 'shape:' + v.shape : 'alone';
  }

  function showIn(name, rooms) {
    settleView(name, rooms);
    const row = make('div', 'showin');
    row.appendChild(make('span', 'dim', 'show it'));
    const choice = make('select');
    const add = function (parent, value, label) {
      const option = make('option', '', label);
      option.value = value;
      parent.appendChild(option);
    };
    add(choice, 'alone', 'on its own');
    const shapes = make('optgroup');
    shapes.label = 'on a floor';
    for (const shape of Object.keys(atlas.roomDimensions)) {
      const d = atlas.roomDimensions[shape];
      add(shapes, 'shape:' + shape, shape + '  (' + d.u * 2 + ' \u00d7 ' + d.v * 2 + ')');
    }
    choice.appendChild(shapes);
    if (rooms.length) {
      const inRooms = make('optgroup');
      inRooms.label = 'in a room that places it';
      for (const n of rooms) {
        const room = byNumber(atlas.rooms).get(n);
        add(inRooms, 'room:' + n, 'room $' + hex(n) + (room ? '  (' + room.dimensions + ')' : ''));
      }
      choice.appendChild(inRooms);
    }
    choice.value = viewKey(view);
    choice.addEventListener('change', function () {
      const said = choice.value;
      view = said === 'alone' ? { kind: 'alone' }
        : said.indexOf('shape:') === 0 ? { kind: 'shape', shape: said.slice(6) }
        : { kind: 'room', room: Number(said.slice(5)) };
      render();
    });
    row.appendChild(choice);
    return row;
  }

  // How an object template moves: one of the game's behaviours, read out of
  // its movers.s (behaviours.js), or none -- and, for one that can be pushed,
  // its weight, which a push loses. The game's build writes mover_of from
  // what this sets in templates.json's meta.movers.
  function moverRow(name) {
    const row = make('div', 'mover');
    row.appendChild(make('span', 'dim', 'moves'));
    const said = moverOf(atlas, name);
    const list = (boot.behaviours && boot.behaviours.list) || [];
    const known = function (behaviour) {
      return list.filter(function (b) { return b.name === behaviour; })[0] || null;
    };

    const choice = make('select');
    const still = make('option', '', 'doesn’t move');
    still.value = '';
    choice.appendChild(still);
    for (const b of list) {
      const option = make('option', '', b.label + (b.kills ? ' — kills' : '') +
                                        (b.loose ? ' — can be pushed' : ''));
      option.value = b.name;
      choice.appendChild(option);
    }
    if (said && !known(said.behaviour)) {
      const option = make('option', '', said.behaviour + ' (not in movers.s)');
      option.value = said.behaviour;
      choice.appendChild(option);
    }
    choice.value = said ? said.behaviour : '';
    choice.title = said ? said.behaviour : 'nothing moves it';
    // Something a push moves weighs 1 or more -- a push of the whole step, at
    // 0, left a gap the pusher spent a turn closing, and the lightest things
    // lurched -- and nothing else weighs anything.
    choice.addEventListener('change', function () {
      const b = known(choice.value);
      const was = (said && said.weight) || 0;
      setMover(atlas, name, choice.value || null, b && b.loose ? Math.max(1, was) : 0);
      changed();
    });
    row.appendChild(choice);

    const pushed = !!(said && known(said.behaviour) && known(said.behaviour).loose);
    const label = make('label', '', 'weight');
    const weight = make('input');
    weight.type = 'number';
    weight.min = 1;
    weight.max = MAX_WEIGHT;
    weight.value = pushed ? Math.max(1, (said && said.weight) || 0) : '';
    weight.disabled = !pushed;
    weight.addEventListener('change', function () {
      setMover(atlas, name, said.behaviour, Math.max(1, Number(weight.value) || 1));
      changed();
    });
    label.appendChild(weight);
    row.appendChild(label);
    row.appendChild(make('span', 'dim', pushed
      ? 'a push moves it its step less this — pushed by the knight, 1 moves 2 a turn, ' +
        '2 moves 1, 3 or more stands firm'
      : 'only something that can be pushed has a weight'));
    return row;
  }

  function piecesTable(template, kind) {
    const table = make('table', 'pieces');
    template.forEach(function (piece, row) {
      const tr = make('tr');
      if (row === chosen) tr.classList.add('on');
      tr.addEventListener('click', function (event) {
        if (event.target && event.target.tagName !== 'TR' &&
            event.target.tagName !== 'TD') return;
        chosen = row;
        render();
      });

      const cell = function () {
        const td = make('td');
        tr.appendChild(td);
        return td;
      };
      cell().appendChild(make('span', 'dim', String(row)));

      // The graphic, picked rather than typed: only a name graphics.json has.
      const which = make('select');
      for (const graphic of graphicList) {
        const option = make('option', '', graphic);
        option.value = graphic;
        which.appendChild(option);
      }
      if (graphicList.indexOf(piece.graphic) < 0) {
        const option = make('option', '', piece.graphic + ' (not in graphics.json)');
        option.value = piece.graphic;
        which.appendChild(option);
      }
      which.value = piece.graphic;
      which.addEventListener('change', function () {
        if (setTemplateGraphic(numbers, template, kind.key, row, which.value)) {
          chosen = row;
          changed();
        }
      });
      cell().appendChild(which);

      // Scenery stands at its own place in the world.
      if (kind.group === 'sceneryTemplates') {
        const where = cell();
        for (const axis of ['u', 'v', 'z']) {
          const label = make('label', '', axis);
          const input = make('input');
          input.type = 'number';
          input.min = 0;
          input.max = 255;
          input.value = piece[axis];
          input.addEventListener('change', function () {
            setTemplateField(template, kind.key, row, axis, Number(input.value) || 0);
            chosen = row;
            changed();
          });
          label.appendChild(input);
          where.appendChild(label);
        }
      }

      const bits = cell();
      const flags = ['flags.mirrored', 'flags.passable'];
      const nudges = kind.group === 'objectTemplates' ? ['offsets.halfU', 'offsets.halfV'] : [];
      for (const field of flags.concat(nudges)) {
        const parts = field.split('.');
        const label = make('label');
        const box = make('input');
        box.type = 'checkbox';
        box.checked = !!(piece[parts[0]] && piece[parts[0]][parts[1]]);
        box.addEventListener('change', function () {
          setTemplateField(template, kind.key, row, field, box.checked);
          chosen = row;
          changed();
        });
        label.appendChild(box);
        label.appendChild(document.createTextNode(parts[1]));
        bits.appendChild(label);
      }
      if (kind.group === 'objectTemplates') {
        const label = make('label', '', 'raise');
        const input = make('input');
        input.type = 'number';
        input.min = 0;
        input.max = 252;
        input.step = 4;
        input.value = (piece.offsets && piece.offsets.raiseZ) || 0;
        input.addEventListener('change', function () {
          setTemplateField(template, kind.key, row, 'offsets.raiseZ', Number(input.value) || 0);
          chosen = row;
          changed();
        });
        label.appendChild(input);
        bits.appendChild(label);
      }
      // Its box. A piece normally takes its graphic's, from graphics.json; one
      // may have its own instead -- an invisible box under artwork has nothing
      // else to give it a size -- and then its three numbers are edited here:
      // half-widths along U and V, and the whole height.
      if (piece.sizeU !== undefined) {
        const own = { u: piece.sizeU, v: piece.sizeV, z: piece.sizeZ };
        const span = make('span', 'boxsize');
        span.appendChild(make('span', 'dim', 'box'));
        for (const axis of ['u', 'v', 'z']) {
          const label = make('label', '', axis);
          const input = make('input');
          input.type = 'number';
          input.min = 0;
          input.max = axis === 'z' ? MAX_BOX_HEIGHT : 255;
          input.value = own[axis];
          input.title = axis === 'z' ? 'its height' : 'half its width along ' + axis.toUpperCase();
          input.addEventListener('change', function () {
            const next = { u: own.u, v: own.v, z: own.z };
            next[axis] = Number(input.value) || 0;
            setTemplateBox(template, row, next);
            chosen = row;
            changed();
          });
          label.appendChild(input);
          span.appendChild(label);
        }
        const drop = make('button', 'small', 'graphic’s box');
        drop.title = 'use the box graphics.json gives ' + piece.graphic + ' again';
        drop.addEventListener('click', function () {
          setTemplateBox(template, row, null);
          chosen = row;
          changed();
        });
        span.appendChild(drop);
        bits.appendChild(span);
      } else {
        const give = make('button', 'small', 'own box');
        give.title = 'give this ' + kind.piece + ' a box of its own, starting from its graphic’s';
        give.addEventListener('click', function () {
          setTemplateBox(template, row, boxOf(boxes, piece) || { u: 8, v: 8, z: 12 });
          chosen = row;
          changed();
        });
        bits.appendChild(give);
      }

      const moves = cell();
      const up = make('button', 'small', '↑');
      up.disabled = row === 0;
      up.title = 'earlier';
      up.addEventListener('click', function () {
        if (movePiece(template, row, row - 1)) { chosen = row - 1; changed(); }
      });
      const down = make('button', 'small', '↓');
      down.disabled = row === template.length - 1;
      down.title = 'later';
      down.addEventListener('click', function () {
        if (movePiece(template, row, row + 1)) { chosen = row + 1; changed(); }
      });
      const drop = make('button', 'small', '✕');
      drop.title = 'remove this ' + kind.piece;
      drop.addEventListener('click', function () {
        if (removePiece(template, row)) {
          chosen = Math.max(0, Math.min(chosen, template.length - 1));
          changed();
        }
      });
      moves.appendChild(up);
      moves.appendChild(down);
      moves.appendChild(drop);

      table.appendChild(tr);
    });
    return table;
  }

  // --- adding a piece --------------------------------------------------------

  // Every graphic the template could take, as a picture with its name, and a
  // filter on the name. A click picks one and Add puts it on the end of the
  // template; a double click does both. Nothing changes until then.
  function openAdder() {
    const overlay = document.getElementById('dialog');
    if (!overlay || !pick) return;
    const template = atlas[pick.group][pick.name];
    const kind = kindOf(pick.group);
    let picked = null;

    overlay.innerHTML = '';
    const dialog = make('div', 'dialog');
    overlay.appendChild(dialog);
    dialog.appendChild(make('h3', '', 'Add a ' + kind.piece + ' to ' + pick.name));
    const controls = make('div', 'controls');
    const filter = make('input');
    filter.type = 'text';
    filter.placeholder = 'Filter by name…';
    filter.addEventListener('input', fill);
    controls.appendChild(filter);
    const count = make('span', 'dim');
    controls.appendChild(count);
    dialog.appendChild(controls);
    const grid = make('div', 'picker');
    dialog.appendChild(grid);

    const foot = make('div', 'foot');
    const says = make('span', 'dim', 'Pick a graphic');
    foot.appendChild(says);
    foot.appendChild(make('span', 'spacer'));
    const cancel = make('button', '', 'Cancel');
    cancel.addEventListener('click', close);
    foot.appendChild(cancel);
    const ok = make('button', 'primary', 'Add');
    ok.disabled = true;
    ok.addEventListener('click', apply);
    foot.appendChild(ok);
    dialog.appendChild(foot);

    function fill() {
      const want = filter.value.trim().toLowerCase();
      grid.innerHTML = '';
      let shown = 0;
      for (const graphic of graphicList) {
        if (want && graphic.toLowerCase().indexOf(want) < 0) continue;
        grid.appendChild(tileFor(graphic));
        shown++;
      }
      count.textContent = shown + ' of ' + graphicList.length;
    }

    function tileFor(graphic) {
      const number = numbers.get(graphic);
      const art = spriteFor(index, number);
      const tile = make('button', 'tile');
      if (graphic === picked) tile.classList.add('here');
      tile.appendChild(artBox(art));
      const caption = make('div', 'caption', graphic);
      caption.appendChild(make('span', 'dim', 'graphic ' + number));
      tile.appendChild(caption);
      tile.title = graphic + ' — graphic ' + number +
        (art ? '  (' + art.width + ' × ' + art.height + ')' : '  (no picture here)');
      tile.addEventListener('click', function () {
        picked = graphic;
        for (const other of grid.children) other.classList.remove('here');
        tile.classList.add('here');
        says.textContent = graphic + ', graphic ' + number;
        ok.disabled = false;
      });
      tile.addEventListener('dblclick', function () {
        picked = graphic;
        apply();
      });
      return tile;
    }

    function apply() {
      if (picked === null) return;
      close();
      chosen = addPiece(template, pick.group, picked);
      changed();
    }

    function close() {
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      adder = null;
    }

    adder = { close: close };
    // A click on the dimmed page round the dialog is Cancel.
    overlay.onmousedown = function (event) {
      if (event.target === overlay) close();
    };
    fill();
    overlay.style.display = 'flex';
    if (filter.focus) filter.focus();
  }

  // One frame of a sheet, as a box with the sheet slid behind it so the frame
  // shows, scaled up by whole numbers -- or down by whole divisions -- to sit
  // in the tile. The picture is the sheet's CSS class, not carried by each.
  const TILE_FIT = 56;

  function artBox(art) {
    const box = make('div', 'artbox');
    if (!art) return box;
    const r = art.rect;
    const inner = make('div', 'art ' + sheetClass(art.sheet));
    inner.style.width = r.w + 'px';
    inner.style.height = r.h + 'px';
    inner.style.backgroundPosition = (-r.x) + 'px ' + (-r.y) + 'px';
    const up = Math.floor(Math.min(TILE_FIT / r.w, TILE_FIT / r.h));
    const scale = up >= 1 ? up : 1 / Math.ceil(Math.max(r.w / TILE_FIT, r.h / TILE_FIT));
    if (scale !== 1) inner.style.transform = 'scale(' + scale + ')';
    box.appendChild(inner);
    return box;
  }

  function sheetClass(onSheet) {
    return 'sheet-' + (onSheet ? onSheet.replace(/[^A-Za-z0-9_-]/g, '_') : 'own');
  }

  // Each sheet's picture, twice over: as a CSS class for the Add dialog's
  // tiles, and as an image the template's picture is drawn from.
  function loadPictures() {
    const all = Object.assign({ '': boot.sheetPng }, boot.otherPngs || {});
    let rules = '';
    for (const key of Object.keys(all)) {
      const uri = all[key];
      if (!uri) continue;
      rules += '.' + sheetClass(key) + ' { background-image: url(' + uri + '); }\n';
      if (loadedFrom[key] === uri) continue;
      loadedFrom[key] = uri;
      const image = new Image();
      image.onload = function () { pictures[key] = image; blankSprites = {}; render(); };
      image.onerror = function () { render(); };
      image.src = uri;
    }
    if (!document.head) return;
    let style = document.getElementById('sheet-pictures');
    if (!style) {
      style = document.createElement('style');
      style.id = 'sheet-pictures';
      document.head.appendChild(style);
    }
    style.textContent = rules;
  }

  // --- the picture ---------------------------------------------------------

  // A template drawn on its own: the room designer's own expansion and draw
  // order, in a room with nothing else in it. Scenery stands where it would in
  // any room; an object group is put down once, in the middle of the floor.
  // What the picture holds: the pieces to draw, which of them are this
  // template's own -- the only ones a click or a drag can reach -- and the
  // floor under them, if there is one to draw.
  //
  // On its own or on a floor, the template is put in a room with nothing else
  // in it: scenery where it stands in any room, an object group once in the
  // middle of the floor. In a room, it is that room, whole, as the designer
  // draws it -- the rest of it there to be seen against, not edited.
  function sceneOf(name) {
    let room;
    let floor = null;
    if (view.kind === 'room') {
      room = byNumber(atlas.rooms).get(view.room);
    }
    if (!room) {
      const shape = view.kind === 'shape' ? view.shape : Object.keys(atlas.roomDimensions)[0];
      room = {
        number: 0, ink: 7, dimensions: shape,
        scenery: pick.group === 'sceneryTemplates' ? [{ template: name, destination: 0 }] : [],
        objects: pick.group === 'objectTemplates'
          ? [{ template: name, positions: [{ u: 3, v: 3, z: 0 }] }] : []
      };
    }
    if (view.kind !== 'alone') floor = sizeOf(atlas, room);
    const items = drawList(expandRoom(atlas, room, numbers, boxes), index, adj, rulesOf(atlas).yOrigin)
      .filter(function (item) { return item.sprite; });
    for (const item of items) {
      item.mine = item.piece.template === name;
      // Drawn where it really is, not where the game's eight bits wrap it: a
      // piece lifted off the top of the screen goes on up, out of the rest,
      // rather than coming back at the bottom. `wraps` says the game would.
      item.x = item.trueX;
      item.base = item.trueBase;
      item.y = item.trueBase - item.height;
    }
    // The floor's height even when no floor is drawn: a piece's footing is
    // marked on it all the same.
    return { items: items, floor: floor, floorZ: sizeOf(atlas, room).z };
  }

  // Whether a sprite draws nothing at all -- Lightkeep's `solid`, an
  // invisible box under artwork. A piece like that is drawn as its box, and
  // picked by it, or there would be nothing to see or to click. Read off the
  // sheet's own picture once a sprite; a picture that cannot be read counts as
  // drawing something.
  let blankSprites = {};

  function isBlank(sprite) {
    const image = pictures[sprite.sheet || ''];
    if (!image) return false;
    const r = sprite.rect;
    const key = (sprite.sheet || '') + ':' + r.x + ',' + r.y + ',' + r.w + ',' + r.h;
    if (Object.prototype.hasOwnProperty.call(blankSprites, key)) return blankSprites[key];
    let blank = false;
    try {
      const scratch = document.createElement('canvas');
      scratch.width = r.w;
      scratch.height = r.h;
      const c = scratch.getContext('2d');
      c.drawImage(image, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      const data = c.getImageData(0, 0, r.w, r.h).data;
      blank = data.length > 0;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] >= 128) { blank = false; break; }
      }
    } catch (err) {
      blank = false;
    }
    blankSprites[key] = blank;
    return blank;
  }

  function itemsOf(name) {
    return sceneOf(name).items;
  }

  // How much room the picture has: the stage's own measured size, or the
  // fallback when there is nothing laid out to measure.
  function stageRoom(canvas) {
    const stage = panes && panes.canvas === canvas ? panes.stage : null;
    const width = stage && stage.clientWidth;
    const height = stage && stage.clientHeight;
    return {
      width: width > 0 ? width - 8 : STAGE_WIDTH,
      height: height > 0 ? height - 8 : STAGE_HEIGHT
    };
  }

  function paint(canvas, template) {
    const scene = sceneOf(pick.name);
    const items = scene.items;
    const grid = { cell: CELL, origin: CELL_ORIGIN, count: CELLS, half: HALF_CELL };
    const yOrigin = rulesOf(atlas).yOrigin;
    const outline = scene.floor ? floorOutline(scene.floor, yOrigin) : [];
    // The template's own pieces carry their box and their footing, to be drawn
    // and for the picture to be cut wide enough to hold them.
    for (const item of items) {
      if (!item.mine) continue;
      item.box = boxOutline(item.piece, yOrigin);
      item.footing = footing(item.piece, scene.floorZ, yOrigin);
      item.blank = isBlank(item.sprite);
    }
    const held = items.filter(function (item) {
      return item.mine && item.piece.entry === chosen;
    })[0];
    lastItems = [];
    if (!items.length && !outline.length) {
      canvas.width = STAGE_WIDTH;
      canvas.height = 60;
      const c = canvas.getContext('2d');
      c.fillStyle = '#000';
      c.fillRect(0, 0, canvas.width, canvas.height);
      return;
    }

    if (!drag) {
      let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
      for (const item of items) {
        const r = item.sprite.rect;
        left = Math.min(left, item.x);
        top = Math.min(top, item.y);
        right = Math.max(right, item.x + r.w);
        bottom = Math.max(bottom, item.y + r.h);
      }
      const ownPoints = [];
      for (const item of items) {
        if (item.mine) ownPoints.push.apply(ownPoints, item.box.corners.concat(item.footing.base));
      }
      for (const point of outline.concat(ownPoints)) {
        left = Math.min(left, point.x);
        top = Math.min(top, point.y);
        right = Math.max(right, point.x);
        bottom = Math.max(bottom, point.y);
      }
      // A margin wide enough to drag a piece a little way out of the rest.
      const pad = 12;
      const wide = right - left + pad * 2;
      const tall = bottom - top + pad * 2;
      // Exactly as big as the pane it sits in; drawn at the whole scale just
      // above that, and shown at the fit.
      const room = stageRoom(canvas);
      const fit = Math.min(room.width / wide, room.height / tall);
      frame = {
        left: left - pad, top: top - pad, wide: wide, tall: tall,
        fit: fit,
        scale: Math.max(1, Math.min(MAX_SCALE, Math.ceil(fit)))
      };
    }
    const left = frame.left;
    const top = frame.top;
    const pad = 0;
    const scale = frame.scale;
    // How wide a line has to be drawn to survive being shown smaller. The
    // picture is drawn at a whole `scale` and shown at the fit, which can be as
    // little as half of it, and nearest-neighbour shrinking keeps only some of
    // the canvas's rows and columns -- so a line one canvas pixel wide could
    // fall between them and an edge go missing. At this width each one keeps
    // at least a screen pixel. Every outline below is drawn this wide or wider,
    // and its dashes scaled with it.
    const thin = Math.max(1, Math.ceil(scale / frame.fit));
    canvas.width = frame.wide * scale;
    canvas.height = frame.tall * scale;
    // ...on the screen at exactly the fit.
    canvas.style.width = Math.floor(frame.wide * frame.fit) + 'px';
    canvas.style.height = Math.floor(frame.tall * frame.fit) + 'px';
    const c = canvas.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#000';
    c.fillRect(0, 0, canvas.width, canvas.height);

    const at = function (p) { return { x: (p.x - left) * scale, y: (p.y - top) * scale }; };
    const trace = function (points) {
      c.beginPath();
      const first = at(points[0]);
      c.moveTo(first.x + 0.5, first.y + 0.5);
      for (let i = 1; i < points.length; i++) {
        const p = at(points[i]);
        c.lineTo(p.x + 0.5, p.y + 0.5);
      }
      c.closePath();
    };
    const path = function (quad) {
      trace(quad);
      c.stroke();
    };

    // The floor first, under everything: its cells faint, its edge less so --
    // the edge being what the walker is clamped to.
    if (outline.length) {
      c.lineWidth = thin;
      c.strokeStyle = 'rgba(255,255,255,.12)';
      for (const quad of floorCells(scene.floor, grid, yOrigin)) path(quad);
      c.strokeStyle = 'rgba(255,255,255,.35)';
      path(outline);
    }

    // Where the selected piece is on the floor, shaded under everything: its
    // box's base, dropped to the floor. The rest of its footing is drawn over
    // the pieces, below, so that nothing standing in front hides it.
    if (held) {
      trace(held.footing.base);
      c.fillStyle = 'rgba(255,255,255,.17)';
      c.fill();
    }

    for (const item of items) {
      const r = item.sprite.rect;
      const x = (item.x - left + pad) * scale;
      const y = (item.y - top + pad) * scale;
      const sheetImage = pictures[item.sprite.sheet || ''];
      if (sheetImage) {
        c.save();
        // The rest of a room is there to be seen against: dimmed.
        c.globalAlpha = item.mine ? 1 : 0.3;
        if (item.piece.mirrored) {
          c.translate(x + r.w * scale, y);
          c.scale(-1, 1);
          c.drawImage(sheetImage, r.x, r.y, r.w, r.h, 0, 0, r.w * scale, r.h * scale);
        } else {
          c.drawImage(sheetImage, r.x, r.y, r.w, r.h, x, y, r.w * scale, r.h * scale);
        }
        c.restore();
      }
      if (!item.mine) continue;
      if (item.blank) {
        // Nothing to click on but its box, so the box is what a click finds.
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const corner of item.box.corners) {
          const p = at(corner);
          x0 = Math.min(x0, p.x);
          y0 = Math.min(y0, p.y);
          x1 = Math.max(x1, p.x);
          y1 = Math.max(y1, p.y);
        }
        lastItems.push({ x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0),
                         entry: item.piece.entry });
      } else {
        lastItems.push({ x: x, y: y, w: r.w * scale, h: r.h * scale, entry: item.piece.entry });
      }
    }

    // A piece's box, edge by edge, the ones a solid box would hide dashed.
    const drawBox = function (box, colour, width) {
      c.strokeStyle = colour;
      c.lineWidth = width;
      for (const edge of box.edges) {
        const a = at(box.corners[edge.from]);
        const b = at(box.corners[edge.to]);
        c.setLineDash(edge.hidden ? [3 * thin, 3 * thin] : []);
        c.beginPath();
        c.moveTo(a.x + 0.5, a.y + 0.5);
        c.lineTo(b.x + 0.5, b.y + 0.5);
        c.stroke();
      }
      c.setLineDash([]);
    };

    // A piece the game would draw wrapped round to the other side of the
    // screen, outlined where it really is.
    for (const item of items) {
      if (!item.mine || !item.wraps) continue;
      const r = item.sprite.rect;
      c.strokeStyle = '#f48771';
      c.lineWidth = 2 * thin;
      c.setLineDash([4 * thin, 3 * thin]);
      c.strokeRect((item.x - left) * scale + thin, (item.y - top) * scale + thin,
                   r.w * scale - 2 * thin, r.h * scale - 2 * thin);
      c.setLineDash([]);
    }

    // An invisible piece is only ever its box, so its box is always drawn.
    for (const item of items) {
      if (item.mine && item.blank && item !== held) drawBox(item.box, 'rgba(120,200,255,.55)', thin);
    }

    // The selected piece: where it is on the floor, the riser up from there to
    // where it stands, its box, and the sprite's own rectangle.
    //
    // Where it is on the floor is the thing a picture like this cannot show by
    // itself: going back along V moves a point up the screen just as lifting
    // it does, so a piece on the floor behind the back wall is drawn where one
    // on a raised floor in front of it would be. Two guide lines cross on the
    // floor at its place, one along U and one along V, each across the room's
    // floor and on out to the piece if it stands beyond it -- so a piece
    // outside the room shows its lines leaving the floor. Over everything,
    // for the same reason.
    if (held) {
      if (scene.floor) {
        c.strokeStyle = GUIDE_COLOUR;
        c.lineWidth = Math.max(thin, Math.round(scale / 2));
        for (const line of floorGuides(held.piece.u, held.piece.v, scene.floor, yOrigin)) {
          const a = at(line[0]);
          const e = at(line[1]);
          c.beginPath();
          c.moveTo(a.x + 0.5, a.y + 0.5);
          c.lineTo(e.x + 0.5, e.y + 0.5);
          c.stroke();
        }
      }
      // Its box's base on the floor, and the point under its middle, which a
      // wall piece's base -- a line, having no depth -- would not show alone.
      trace(held.footing.base);
      c.strokeStyle = 'rgba(255,255,255,.8)';
      c.lineWidth = thin;
      c.stroke();
      const foot = at(held.footing.foot);
      const dot = 3 * scale;             // three of the game's pixels
      c.fillStyle = '#fff';
      c.fillRect(Math.round(foot.x - dot / 2), Math.round(foot.y - dot / 2), dot, dot);

      if (held.piece.z > scene.floorZ) {
        const foot = at(held.footing.foot);
        const head = at(held.footing.head);
        // A game pixel wide, solid: the picture may be shown smaller than it is
        // drawn, and a thin dashed line can thin away to nothing.
        c.fillStyle = 'rgba(255,255,255,.8)';
        c.fillRect(Math.round(foot.x - scale / 2), Math.round(head.y), scale,
                   Math.max(0, Math.round(foot.y - head.y)));
      }
      drawBox(held.box, '#3794ff', 2 * thin);
      if (!held.blank) {
        const r = held.sprite.rect;
        // Just outside the sprite, so it covers none of it.
        c.strokeStyle = 'rgba(255,255,255,.8)';
        c.lineWidth = thin;
        c.setLineDash([3 * thin, 2 * thin]);
        c.strokeRect((held.x - left) * scale - thin / 2, (held.y - top) * scale - thin / 2,
                     r.w * scale + thin, r.h * scale + thin);
        c.setLineDash([]);
      }
    }

    // Pressing on a piece selects it -- the last one drawn under the pointer,
    // which is the one in front -- and picks it up, as the room designer does
    // an object. It is put down where the pointer lets go.
    canvas.addEventListener('mousedown', function (event) {
      const box = canvas.getBoundingClientRect();
      const across = canvas.width / (box.width || canvas.width);
      const px = (event.clientX - box.left) * across;
      const py = (event.clientY - box.top) * (canvas.height / (box.height || canvas.height));
      for (let i = lastItems.length - 1; i >= 0; i--) {
        const d = lastItems[i];
        if (px >= d.x && px < d.x + d.w && py >= d.y && py < d.y + d.h) {
          chosen = d.entry;
          const template = atlas[pick.group][pick.name];
          drag = {
            at: d.entry,
            from: JSON.parse(JSON.stringify(template[d.entry])),
            x: event.clientX,
            y: event.clientY,
            // Screen pixels to the game's own: the canvas's measured size and
            // the picture's whole-pixel scale both come off.
            per: across / frame.scale,
            moved: false
          };
          if (event.preventDefault) event.preventDefault();
          render();
          return;
        }
      }
    });
  }

  // While a piece is held, the pointer's travel is a move in world units at
  // the piece's own height. Nothing is saved until it is let go: one drag is
  // one step of the editor's undo, not one for every pixel.
  function dragTo(event) {
    if (!drag || !pick) return;
    const template = atlas[pick.group][pick.name];
    const dx = Math.round((event.clientX - drag.x) * drag.per);
    const dy = Math.round((event.clientY - drag.y) * drag.per);
    const move = screenToWorld(dx, dy);
    if (shiftPiece(template, pick.group, drag.at, move, drag.from)) {
      drag.moved = true;
      render();
    }
  }

  // The bar under the picture: dragged, it sets how tall the top pane is and
  // the picture is refitted to it -- nothing else is rebuilt, so the pieces
  // below keep their place and their scroll.
  function resizeTo(event) {
    if (!resizing || !panes) return;
    const most = Math.max(TOP_MIN, (el.main.clientHeight || 10000) - BOTTOM_MIN);
    topHeight = Math.max(TOP_MIN, Math.min(most, resizing.from + (event.clientY - resizing.y)));
    panes.top.style.height = topHeight + 'px';
    const template = pick && atlas[pick.group][pick.name];
    if (template) paint(panes.canvas, template);
  }

  function stopResizing() {
    if (!resizing) return;
    resizing = null;
    for (const bar of document.querySelectorAll ? document.querySelectorAll('.split') : []) {
      bar.classList.remove('on');
    }
    try {
      if (window.localStorage) window.localStorage.setItem(TOP_KEY, String(topHeight));
    } catch (err) {
      // Somewhere to remember it is a nicety; the bar works without one.
    }
  }

  function letGo() {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    if (moved) changed();
    else render();
  }

  // The keys, as the room designer has them: the arrows move along the floor,
  // and with Ctrl the up and down arrows lift and lower -- Z is the other thing
  // those two could mean, so it gets the modifier rather than a key elsewhere.
  // [ and ] lift and lower as well. Delete removes the piece.
  //
  // How far a step goes depends on the piece. Scenery is in world units, one at
  // a time or eight with Shift. An object's only move is its nudge, so an
  // arrow switches its half-cell on or off, and a lift is four -- the game
  // masks the raise to a multiple of four -- or a whole level with Shift.
  function keyed(event) {
    // The Add dialog takes the keys while it is open: Escape closes it, and
    // nothing reaches the template behind it.
    if (adder) {
      if (event.key === 'Escape') adder.close();
      return;
    }
    if (!pick || drag) return;
    const target = event.target;
    if (target && /INPUT|SELECT|TEXTAREA/.test(target.tagName || '')) return;
    const template = atlas[pick.group][pick.name];
    if (!template || !template[chosen]) return;

    const scenery = pick.group === 'sceneryTemplates';
    const along = scenery ? (event.shiftKey ? 8 : 1) : HALF_CELL;
    const lift = scenery ? (event.shiftKey ? 8 : 1) : (event.shiftKey ? LEVEL_Z : 4);
    const ctrl = event.ctrlKey || event.metaKey;
    const move = {};
    if (ctrl && event.key === 'ArrowUp') move.z = lift;
    else if (ctrl && event.key === 'ArrowDown') move.z = -lift;
    else if (event.key === ']') move.z = lift;
    else if (event.key === '[') move.z = -lift;
    else if (event.key === 'ArrowLeft') move.u = -along;
    else if (event.key === 'ArrowRight') move.u = along;
    else if (event.key === 'ArrowUp') move.v = along;
    else if (event.key === 'ArrowDown') move.v = -along;
    else if (event.key === 'Delete' || event.key === 'Backspace') {
      if (event.preventDefault) event.preventDefault();
      removePiece(template, chosen);
      chosen = Math.max(0, Math.min(chosen, template.length - 1));
      changed();
      return;
    } else return;

    if (event.preventDefault) event.preventDefault();
    if (shiftPiece(template, pick.group, chosen, move)) changed();
  }

  if (window.addEventListener) {
    window.addEventListener('mousemove', dragTo);
    window.addEventListener('mouseup', letGo);
    window.addEventListener('mousemove', resizeTo);
    window.addEventListener('mouseup', stopResizing);
    window.addEventListener('keydown', keyed);
    // The window itself resized -- the panel dragged wider, or moved to
    // another monitor: refit the picture to what it has now.
    window.addEventListener('resize', function () {
      const template = panes && pick && atlas[pick.group][pick.name];
      if (template && !drag) paint(panes.canvas, template);
    });
  }

  function render() {
    renderList();
    renderMain();
    if (panes && window.requestAnimationFrame) {
      const was = panes;
      window.requestAnimationFrame(function () {
        const template = panes === was && pick && atlas[pick.group][pick.name];
        if (template && !drag) paint(panes.canvas, template);
      });
    }
  }

  // --- start ---------------------------------------------------------------

  function start() {
    load(boot);
    loadPictures();
    render();
  }

  // The designer beside this, an undo, or the text editor changed the file.
  if (host.onReload) {
    host.onReload(function (next) {
      load(next);
      loadPictures();
      render();
    });
  }

  start();
})();
</script>
</body>
</html>

[package]
name = "zx-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zx-server"
path = "src/main.rs"

[dependencies]
zx-core = { path = "../zx-core" }
zx-engine = { path = "../zx-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
rmcp = { version = "3.1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
anyhow = "1"

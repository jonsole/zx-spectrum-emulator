# Builds the web emulator (web/) and publishes it to GitHub Pages: the core
# compiled to WebAssembly, the page, and the ROMs. What it runs is not part of
# the site: each visitor opens a snapshot of their own (docs/web.md). Beside it
# are knightlore.html and pentagram.html, which make the Filmation Knight Lore
# and Pentagram from a visitor's own copy of the original: each remake is
# built here with everything of Ultimate's left out.
#
# Needs Pages turned on with "GitHub Actions" as its source (Settings > Pages).

name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'cpp-core/src/**'
      - 'cpp-core/third_party/miniz/**'
      - 'scripts/fetch_roms.py'
      - 'examples/filmation/**'
      - '.github/workflows/pages.yml'
  # Built and tested on a pull request too, so a change that breaks the site
  # is seen before it is merged; only master deploys.
  pull_request:
    paths:
      - 'web/**'
      - 'cpp-core/src/**'
      - 'cpp-core/third_party/miniz/**'
      - 'scripts/fetch_roms.py'
      - 'examples/filmation/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run a branch at a time, so two of master's deployments never overlap.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Emscripten the site is built and tested with; a newer one is a
  # deliberate change, not something a rebuild picks up on its own.
  EMSDK_VERSION: 6.0.11
  # The sjasmplus the Filmation games are assembled with -- the same version
  # scripts/fetch_sjasmplus.py fetches for Windows. It has no Linux release,
  # so it is built from its source.
  SJASMPLUS_VERSION: 1.23.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      # Amstrad allow the ROMs' distribution, which is why the release bundles
      # them and the site can too -- but the repository never holds them.
      - name: Fetch the ROMs
        run: python scripts/fetch_roms.py --dest "$RUNNER_TEMP/roms"

      - name: Build the site
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python web/build.py --roms "$RUNNER_TEMP/roms"

      - name: Build sjasmplus
        run: |
          git clone --quiet --depth 1 --branch "v$SJASMPLUS_VERSION" --recurse-submodules \
            --shallow-submodules https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -C "$RUNNER_TEMP/sjasmplus" -j"$(nproc)" > /dev/null
          echo "SJASMPLUS=$RUNNER_TEMP/sjasmplus/sjasmplus" >> "$GITHUB_ENV"

      # The remake for knightlore.html, with everything of Ultimate's blanked --
      # built four ways, and checked that those are all the original changes.
      - name: Build the Knight Lore remake
        run: |
          python -m pip install --quiet "pillow>=10.0"
          python web/knightlore_template.py --out web/site --reference "$RUNNER_TEMP/knightlore"

      # The same for pentagram.html -- built four ways, with blanks of the
      # shape web/pentagram_layout.json gives for what the repository does
      # not carry.
      - name: Build the Pentagram remake
        run: python web/pentagram_template.py --out web/site --reference "$RUNNER_TEMP/pentagram"

      # Loads the ROMs, a 48K and a 128K .z80 and a .sna into the built
      # module and runs frames of each, so a site that cannot run a
      # snapshot is never deployed.
      - name: Test the site
        run: node web/tests/smoke_test.js

      # The .z80 knightlore.html makes must be the one build.py makes, byte
      # for byte, and it must read a copy as original.py does.
      - name: Test the Knight Lore remake
        run: node web/tests/knightlore_test.js web/site "$RUNNER_TEMP/knightlore"

      - name: Test the Pentagram remake
        run: node web/tests/pentagram_test.js web/site "$RUNNER_TEMP/pentagram"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

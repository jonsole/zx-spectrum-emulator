<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZX Spectrum Loading Screen</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px var(--vscode-font-family, system-ui, sans-serif);
           color: var(--vscode-foreground); background: var(--vscode-editor-background);
           display: flex; flex-direction: column; overflow: hidden; }

    #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
           padding: 8px 12px; border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,.35)); }
    #bar .group { display: flex; align-items: center; gap: 6px; }
    #bar .spacer { flex: 1 1 auto; }
    button { font: inherit; padding: 4px 12px; border: 0; border-radius: 2px; cursor: pointer;
             color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
             background: var(--vscode-button-secondaryBackground, rgba(128,128,128,.2)); }
    button:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground, rgba(128,128,128,.32)); }
    button.primary { color: var(--vscode-button-foreground); background: var(--vscode-button-background); }
    button.primary:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
    button:disabled { opacity: .4; cursor: default; }
    label { display: flex; align-items: center; gap: 5px; opacity: .9; }
    input[type=range] { width: 260px; }

    #stage { flex: 1 1 auto; display: flex; min-height: 0; }
    #left { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 16px; min-width: 0; gap: 10px; }
    #screenBox { position: relative; flex: none; box-shadow: 0 2px 14px rgba(0,0,0,.45); }
    #screen { display: block; image-rendering: pixelated; }
    #overlay { position: absolute; left: 0; top: 0; cursor: crosshair; }
    #noScreen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                text-align: center; padding: 20px; opacity: .75; line-height: 1.6; color: #ccc; }
    #timeline { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px;
                justify-content: center; }
    #clock { font-variant-numeric: tabular-nums; opacity: .8; min-width: 7.5em; }

    #side { flex: none; width: 280px; display: flex; flex-direction: column; min-height: 0;
            border-left: 1px solid var(--vscode-panel-border, rgba(128,128,128,.35)); }
    #sideHead { padding: 10px 12px 6px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
    #sideHead span { font-weight: normal; opacity: .6; font-size: 12px; }
    #list { flex: 1 1 auto; overflow: auto; padding: 0 6px 10px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 3px;
           cursor: grab; user-select: none; }
    .row:hover { background: var(--vscode-list-hoverBackground, rgba(128,128,128,.12)); }
    .row.selected { background: var(--vscode-list-activeSelectionBackground, rgba(80,120,200,.4));
                    color: var(--vscode-list-activeSelectionForeground, inherit); }
    .row.dragging { opacity: .4; }
    .row.dropBefore { box-shadow: inset 0 2px 0 var(--vscode-focusBorder, #4d9eff); }
    .row.dropAfter { box-shadow: inset 0 -2px 0 var(--vscode-focusBorder, #4d9eff); }
    .row .no { flex: none; width: 1.8em; text-align: right; opacity: .65; font-variant-numeric: tabular-nums; }
    .row .where { flex: 1 1 auto; font-variant-numeric: tabular-nums; }
    .row .cost { flex: none; opacity: .7; font-variant-numeric: tabular-nums; }
    .row .drop { flex: none; border: 0; background: none; color: inherit; cursor: pointer;
                 opacity: 0; padding: 0 4px; font-size: 14px; line-height: 1; }
    .row:hover .drop, .row.selected .drop { opacity: .7; }
    .row .drop:hover { opacity: 1; }
    #empty { padding: 6px 12px; opacity: .7; line-height: 1.55; }

    #status { flex: none; padding: 7px 12px; border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,.35));
              display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    #status .warn { color: var(--vscode-editorWarning-foreground, #cca700); }
    #status .spacer { flex: 1 1 auto; }
    .hint { opacity: .6; font-size: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <button id="auto" class="primary" title="Start from the order convert_tape.py would pick by itself: top to bottom, skipping empty rows">Fill from picture</button>
      <button id="clear" title="Take every rectangle out of the order">Clear</button>
    </div>
    <div class="group">
      <button id="play" title="Watch the picture load at the speed the tape really loads it">Play</button>
      <label title="Play it faster or slower than the tape, to study a moment or skim a long load">
        Speed
        <select id="speed">
          <option value="0.25">&frac14;&times;</option>
          <option value="0.5">&frac12;&times;</option>
          <option value="1" selected>1&times;</option>
          <option value="2">2&times;</option>
          <option value="4">4&times;</option>
        </select>
      </label>
    </div>
    <div class="group">
      <label title="Draw the cell grid over the picture"><input id="grid" type="checkbox" checked> Grid</label>
      <label title="Number every rectangle on the picture"><input id="numbers" type="checkbox" checked> Numbers</label>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <span id="pictureName" class="hint"></span>
      <button id="pick" title="Choose the .scr, .tap, .sna, .z80 or .tzx the screen comes from, keeping the order">Picture...</button>
      <button id="python" title="Copy the order as gen_block() calls, for a hand-written build script">Copy as Python</button>
    </div>
  </div>

  <div id="stage">
    <div id="left">
      <div id="screenBox">
        <canvas id="screen" width="256" height="192"></canvas>
        <canvas id="overlay"></canvas>
        <div id="noScreen" class="hidden">No picture yet, or it can't be read.<br>
          <b>Picture...</b> chooses the one this screen is.</div>
      </div>
      <div id="timeline">
        <input id="scrub" type="range" min="0" max="1000" value="1000" step="1"
               title="Drag to see the screen at any moment during the load">
        <span id="clock">0.00 s</span>
      </div>
    </div>

    <div id="side">
      <div id="sideHead">Loading order <span id="count"></span></div>
      <div id="list"></div>
      <div id="empty">Drag on the picture to add a rectangle. Each one is sent in the order it is listed,
        so the order here is the order the picture appears in. Drag a row to move it.</div>
    </div>
  </div>

  <div id="status">
    <span id="time"></span>
    <span id="bytes"></span>
    <span class="spacer"></span>
    <span id="problems"></span>
  </div>

<script>
    // tape_model.js -- rectangles, what they cost and what has arrived -- is
    // inlined here by the extension so the page and the tests share it.
    /*@tape_model.js@*/

    const vscode = acquireVsCodeApi();

    const PALETTE = [
      [0, 0, 0], [0, 0, 192], [192, 0, 0], [192, 0, 192],
      [0, 192, 0], [0, 192, 192], [192, 192, 0], [192, 192, 192],
      [0, 0, 0], [0, 0, 255], [255, 0, 0], [255, 0, 255],
      [0, 255, 0], [0, 255, 255], [255, 255, 0], [255, 255, 255]
    ];

    let screen = null;          // Uint8Array(6912), or null while the tape has no picture
    let regions = [];
    let selected = -1;
    let runs = [];
    let bits = 0;
    let playing = false;
    let playedBits = null;      // null while editing: the whole picture is shown
    let lastFrame = 0;
    let problems = [];

    const screenCanvas = document.getElementById('screen');
    const screenCtx = screenCanvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const box = document.getElementById('screenBox');
    const scrub = document.getElementById('scrub');

    // --- the picture -------------------------------------------------------

    // The screen as the ULA would show it, with `loaded` (or null for all of
    // it) saying which bytes have arrived. A byte that has not arrived reads
    // as zero, and an attribute that has not arrived as black on black -- so
    // pixels that land before their attributes are invisible, exactly as they
    // are on the real machine, which is why gen_block sends the colours first.
    function drawScreen(loaded) {
      const image = screenCtx.createImageData(256, 192);
      for (let y = 0; y < 192; y++) {
        for (let x = 0; x < 256; x++) {
          const at = (y * 256 + x) * 4;
          let rgb = [0, 0, 0];
          if (screen) {
            const offset = pixelAddress(x >> 3, y);
            const attrAt = BITMAP_BYTES + (y >> 3) * 32 + (x >> 3);
            const pixels = !loaded || loaded[offset] ? screen[offset] : 0;
            const attr = !loaded || loaded[attrAt] ? screen[attrAt] : 0;
            const bright = (attr & 0x40) ? 8 : 0;
            const set = (pixels >> (7 - (x & 7))) & 1;
            rgb = PALETTE[(set ? (attr & 7) : ((attr >> 3) & 7)) | bright];
          }
          image.data[at] = rgb[0];
          image.data[at + 1] = rgb[1];
          image.data[at + 2] = rgb[2];
          image.data[at + 3] = 255;
        }
      }
      screenCtx.putImageData(image, 0, 0);
    }

    // Whole multiples of the Spectrum's own pixels, so a cell is always a
    // whole number of screen pixels and the grid lands on cell edges -- until
    // there isn't room for even one, when it shrinks rather than spill over.
    function fit() {
      const left = document.getElementById('left');
      const wide = left.clientWidth - 32;
      const high = left.clientHeight - 32 - 40;
      const room = Math.min(wide / 256, high / 192);
      const scale = room >= 1 ? Math.floor(room) : Math.max(0.5, room);
      const w = Math.round(256 * scale);
      const h = Math.round(192 * scale);
      screenCanvas.style.width = w + 'px';
      screenCanvas.style.height = h + 'px';
      box.style.width = w + 'px';
      box.style.height = h + 'px';
      overlay.width = w;
      overlay.height = h;
      overlay.style.width = w + 'px';
      overlay.style.height = h + 'px';
      drawOverlay();
    }

    function cellSize() {
      return overlay.width / 32;
    }

    // --- the rectangles on top ---------------------------------------------

    function drawOverlay() {
      const cell = cellSize();
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (!screen) {
        return;
      }
      if (document.getElementById('grid').checked) {
        overlayCtx.strokeStyle = 'rgba(255,255,255,.12)';
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        for (let col = 1; col < 32; col++) {
          overlayCtx.moveTo(Math.round(col * cell) + .5, 0);
          overlayCtx.lineTo(Math.round(col * cell) + .5, overlay.height);
        }
        for (let row = 1; row < 24; row++) {
          overlayCtx.moveTo(0, Math.round(row * cell) + .5);
          overlayCtx.lineTo(overlay.width, Math.round(row * cell) + .5);
        }
        overlayCtx.stroke();
      }
      const numbers = document.getElementById('numbers').checked;
      for (let i = 0; i < regions.length; i++) {
        const r = regions[i];
        const x = Math.round(r.x * cell);
        const y = Math.round(r.y * cell);
        const w = Math.round(r.w * cell);
        const h = Math.round(r.h * cell);
        const on = i === selected;
        overlayCtx.lineWidth = on ? 2 : 1;
        overlayCtx.strokeStyle = on ? '#ffd400' : 'rgba(120,190,255,.85)';
        overlayCtx.strokeRect(x + .5, y + .5, w - 1, h - 1);
        if (on) {
          overlayCtx.fillStyle = 'rgba(255,212,0,.12)';
          overlayCtx.fillRect(x, y, w, h);
        }
        if (numbers) {
          const label = String(i + 1);
          overlayCtx.font = 'bold 11px sans-serif';
          const tw = overlayCtx.measureText(label).width;
          overlayCtx.fillStyle = on ? '#ffd400' : 'rgba(120,190,255,.9)';
          overlayCtx.fillRect(x + 1, y + 1, tw + 7, 14);
          overlayCtx.fillStyle = '#000';
          overlayCtx.fillText(label, x + 4, y + 12);
        }
      }
      if (drag && drag.kind === 'draw' && drag.region) {
        const r = drag.region;
        overlayCtx.lineWidth = 2;
        overlayCtx.strokeStyle = '#ffd400';
        overlayCtx.setLineDash([4, 3]);
        overlayCtx.strokeRect(Math.round(r.x * cell) + .5, Math.round(r.y * cell) + .5,
                              Math.round(r.w * cell) - 1, Math.round(r.h * cell) - 1);
        overlayCtx.setLineDash([]);
      }
    }

    // --- what the order costs ----------------------------------------------

    function recost() {
      runs = screen ? patternRuns(screen, regions) : [];
      bits = totalBits(runs);
      const cover = screen ? coverage(screen, regions) : null;
      const sent = cover ? cover.sent.reduce((sum, byte) => sum + byte, 0) : 0;
      document.getElementById('time').textContent =
        regions.length ? seconds(bits).toFixed(2) + ' s to load' : '';
      document.getElementById('bytes').textContent =
        regions.length ? sent + ' bytes in ' + runs.length + ' runs' : '';
      const notes = problems.slice();
      if (cover && cover.missed) {
        notes.push(cover.missed + (cover.missed === 1 ? ' cell has' : ' cells have') +
                   ' something in them that is never loaded');
      }
      if (cover && cover.repeated) {
        notes.push(cover.repeated + ' bytes are sent twice (' + seconds(cover.repeated * 8).toFixed(2) + ' s)');
      }
      const where = document.getElementById('problems');
      where.textContent = notes.join(' · ');
      where.className = notes.length ? 'warn' : '';
    }

    function drawList() {
      const list = document.getElementById('list');
      document.getElementById('count').textContent =
        regions.length ? regions.length + (regions.length === 1 ? ' rectangle' : ' rectangles') : '';
      document.getElementById('empty').classList.toggle('hidden', regions.length > 0);
      list.textContent = '';
      for (let i = 0; i < regions.length; i++) {
        const r = regions[i];
        const cost = screen ? seconds(totalBits(patternRuns(screen, [r])) - END_BITS) : 0;
        const row = document.createElement('div');
        row.className = 'row' + (i === selected ? ' selected' : '');
        row.draggable = true;
        row.dataset.index = String(i);
        const no = document.createElement('span');
        no.className = 'no';
        no.textContent = (i + 1) + '.';
        const where = document.createElement('span');
        where.className = 'where';
        where.textContent = r.w + '×' + r.h + ' at ' + r.x + ',' + r.y;
        const cs = document.createElement('span');
        cs.className = 'cost';
        cs.textContent = cost.toFixed(2) + ' s';
        const drop = document.createElement('button');
        drop.className = 'drop';
        drop.textContent = '×';
        drop.title = 'Take this rectangle out of the order';
        drop.addEventListener('click', (event) => {
          event.stopPropagation();
          remove(i);
        });
        row.append(no, where, cs, drop);
        row.addEventListener('click', () => select(i));
        list.appendChild(row);
      }
    }

    function redraw() {
      recost();
      drawList();
      drawScreen(playedBits === null ? null : loadedAt(runs, playedBits));
      drawOverlay();
      document.getElementById('noScreen').classList.toggle('hidden', !!screen);
      document.getElementById('clock').textContent =
        (playedBits === null ? seconds(bits) : seconds(playedBits)).toFixed(2) + ' s';
      if (playedBits === null) {
        scrub.value = String(scrub.max);
      }
      document.getElementById('play').textContent = playing ? 'Stop' : 'Play';
      for (const id of ['play', 'clear', 'python']) {
        document.getElementById(id).disabled = !regions.length;
      }
      document.getElementById('auto').disabled = !screen;
    }

    // --- changing the order ------------------------------------------------

    // Every change goes back to the screen file, through the extension: its
    // undo, dirty mark and Save are this editor's, and the tape's page sees the
    // change as it happens.
    function commit() {
      vscode.postMessage({ type: 'order', regions });
      redraw();
    }

    function select(index) {
      selected = index;
      stop();
      redraw();
    }

    function remove(index) {
      regions.splice(index, 1);
      if (selected >= regions.length) {
        selected = regions.length - 1;
      }
      commit();
    }

    function move(from, to) {
      if (from === to || to < 0 || to >= regions.length) {
        return;
      }
      const [region] = regions.splice(from, 1);
      regions.splice(to, 0, region);
      selected = to;
      commit();
    }

    // --- drawing and dragging on the picture -------------------------------

    let drag = null;

    function cellAt(event) {
      const rect = overlay.getBoundingClientRect();
      const cell = cellSize();
      return {
        col: Math.max(0, Math.min(31, Math.floor((event.clientX - rect.left) / cell))),
        row: Math.max(0, Math.min(23, Math.floor((event.clientY - rect.top) / cell)))
      };
    }

    function regionAt(col, row) {
      // Topmost first: the last rectangle drawn over a cell is the one a click
      // in it means, which matches what the picture shows.
      for (let i = regions.length - 1; i >= 0; i--) {
        const r = regions[i];
        if (col >= r.x && col < r.x + r.w && row >= r.y && row < r.y + r.h) {
          return i;
        }
      }
      return -1;
    }

    overlay.addEventListener('pointerdown', (event) => {
      if (!screen || event.button !== 0) {
        return;
      }
      overlay.setPointerCapture(event.pointerId);
      stop();
      const at = cellAt(event);
      const hit = regionAt(at.col, at.row);
      // Inside a rectangle, a drag moves it; anywhere else, a drag draws a new
      // one. Holding Alt always draws, for adding a rectangle over another.
      if (hit >= 0 && !event.altKey) {
        selected = hit;
        drag = { kind: 'move', index: hit, from: at, origin: Object.assign({}, regions[hit]), moved: false };
      } else {
        drag = { kind: 'draw', from: at, region: { x: at.col, y: at.row, w: 1, h: 1 } };
      }
      redraw();
    });

    overlay.addEventListener('pointermove', (event) => {
      if (!drag) {
        return;
      }
      const at = cellAt(event);
      if (drag.kind === 'draw') {
        drag.region = clampRegion({
          x: Math.min(drag.from.col, at.col), y: Math.min(drag.from.row, at.row),
          w: Math.abs(at.col - drag.from.col) + 1, h: Math.abs(at.row - drag.from.row) + 1
        });
        drawOverlay();
      } else {
        const dx = at.col - drag.from.col;
        const dy = at.row - drag.from.row;
        if (dx || dy) {
          drag.moved = true;
        }
        const origin = drag.origin;
        regions[drag.index] = clampRegion({
          x: Math.max(0, Math.min(32 - origin.w, origin.x + dx)),
          y: Math.max(0, Math.min(24 - origin.h, origin.y + dy)),
          w: origin.w, h: origin.h
        });
        redraw();
      }
    });

    overlay.addEventListener('pointerup', (event) => {
      if (!drag) {
        return;
      }
      overlay.releasePointerCapture(event.pointerId);
      if (drag.kind === 'draw') {
        regions.push(drag.region);
        selected = regions.length - 1;
        drag = null;
        commit();
      } else {
        const changed = drag.moved;
        drag = null;
        if (changed) {
          commit();
        } else {
          redraw();
        }
      }
    });

    // Arrows nudge the selected rectangle, Shift+arrows resize it from its far
    // edge, Delete takes it out and [ ] move it through the order.
    document.addEventListener('keydown', (event) => {
      if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') {
        return;
      }
      if (selected < 0 || selected >= regions.length) {
        return;
      }
      const r = Object.assign({}, regions[selected]);
      const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
      if (step) {
        if (event.shiftKey) {
          r.w = Math.max(1, r.w + step[0]);
          r.h = Math.max(1, r.h + step[1]);
        } else {
          r.x += step[0];
          r.y += step[1];
        }
        regions[selected] = clampRegion(r);
        commit();
      } else if (event.key === 'Delete' || event.key === 'Backspace') {
        remove(selected);
      } else if (event.key === '[') {
        move(selected, selected - 1);
      } else if (event.key === ']') {
        move(selected, selected + 1);
      } else {
        return;
      }
      event.preventDefault();
    });

    // --- reordering the list by dragging -----------------------------------

    let dragRow = -1;
    const list = document.getElementById('list');

    list.addEventListener('dragstart', (event) => {
      const row = event.target.closest('.row');
      if (!row) {
        return;
      }
      dragRow = Number(row.dataset.index);
      row.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(dragRow));
    });

    list.addEventListener('dragover', (event) => {
      const row = event.target.closest('.row');
      if (!row || dragRow < 0) {
        return;
      }
      event.preventDefault();
      const rect = row.getBoundingClientRect();
      const after = event.clientY > rect.top + rect.height / 2;
      for (const other of list.querySelectorAll('.row')) {
        other.classList.remove('dropBefore', 'dropAfter');
      }
      row.classList.add(after ? 'dropAfter' : 'dropBefore');
    });

    list.addEventListener('drop', (event) => {
      const row = event.target.closest('.row');
      if (!row || dragRow < 0) {
        return;
      }
      event.preventDefault();
      const rect = row.getBoundingClientRect();
      const after = event.clientY > rect.top + rect.height / 2;
      let to = Number(row.dataset.index) + (after ? 1 : 0);
      if (to > dragRow) {
        to--;
      }
      move(dragRow, to);
      dragRow = -1;
    });

    list.addEventListener('dragend', () => {
      dragRow = -1;
      drawList();
    });

    // --- playing it back ---------------------------------------------------

    function stop() {
      playing = false;
      playedBits = null;
    }

    function tick(now) {
      if (!playing) {
        return;
      }
      const speed = Number(document.getElementById('speed').value);
      const step = (now - lastFrame) / 1000 * speed;
      lastFrame = now;
      playedBits += step * CPU_HZ / BIT_TSTATES;
      if (playedBits >= bits) {
        playedBits = bits;
        playing = false;
      }
      scrub.value = String(Math.round(playedBits / Math.max(1, bits) * Number(scrub.max)));
      redraw();
      if (playing) {
        requestAnimationFrame(tick);
      }
    }

    document.getElementById('play').addEventListener('click', () => {
      if (playing) {
        stop();
      } else {
        playing = true;
        playedBits = playedBits === null || playedBits >= bits ? 0 : playedBits;
        lastFrame = performance.now();
        requestAnimationFrame(tick);
      }
      redraw();
    });

    scrub.addEventListener('input', () => {
      playing = false;
      const fraction = Number(scrub.value) / Number(scrub.max);
      playedBits = fraction >= 1 ? null : fraction * bits;
      redraw();
    });

    // --- the toolbar -------------------------------------------------------

    document.getElementById('auto').addEventListener('click', () => {
      if (!screen) {
        return;
      }
      regions = autoRegions(screen);
      selected = regions.length - 1;
      stop();
      commit();
    });

    document.getElementById('clear').addEventListener('click', () => {
      regions = [];
      selected = -1;
      stop();
      commit();
    });

    document.getElementById('python').addEventListener('click', () =>
      vscode.postMessage({ type: 'python', text: pythonFor(regions) }));
    document.getElementById('pick').addEventListener('click', () => vscode.postMessage({ type: 'pick' }));
    document.getElementById('grid').addEventListener('change', drawOverlay);
    document.getElementById('numbers').addEventListener('change', drawOverlay);

    // --- talking to the extension ------------------------------------------

    window.addEventListener('message', (event) => {
      const message = event.data;
      if (message.type !== 'load') {
        return;
      }
      screen = message.screen ? Uint8Array.from(atob(message.screen), (c) => c.charCodeAt(0)) : null;
      regions = message.regions.map(clampRegion);
      problems = message.problems || [];
      document.getElementById('pictureName').textContent = message.picture || '';
      if (selected >= regions.length) {
        selected = regions.length - 1;
      }
      stop();
      fit();
      redraw();
    });

    new ResizeObserver(fit).observe(document.getElementById('left'));
    fit();
    redraw();
    vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
